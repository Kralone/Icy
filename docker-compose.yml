services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iceforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-iceforgedb}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-icy}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PSWD:-change_me_local_only}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [internal]

  backend:
    image: iceforge/backend:local
    build:
      context: ./icy_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://db:5432/iceforgedb}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-iceforge}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change_me_local_only}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-http://localhost:8088/images/}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_LOCAL_JWT_SECRET_32_CHARS_MINIMUM}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CIG_WATCH_PUBLISHING_ENABLED: ${CIG_WATCH_PUBLISHING_ENABLED:-true}
      CIG_WATCH_DISCORD_ENABLED: ${CIG_WATCH_DISCORD_ENABLED:-false}
      CIG_WATCH_TRANSLATION_URL: ${CIG_WATCH_TRANSLATION_URL:-http://libretranslate:5000}
      UEX_API_KEY: ${UEX_API_KEY:-}
      BOT_API_KEY: ${BOT_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@iceforge.fr}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-icy}
      RABBITMQ_PASSWORD: ${RABBITMQ_PSWD:-change_me_local_only}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      VAULT_ENABLED: ${VAULT_ENABLED:-false}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_PATH: ${BACKEND_VAULT_KV_PATH:-iceforge/dev/backend}
      VAULT_ROLE_ID: ${BACKEND_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${BACKEND_VAULT_SECRET_ID:-}
      VAULT_FAIL_FAST: ${VAULT_FAIL_FAST:-true}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    expose: ["8080"]
    volumes:
      - backend_logs:/app/logs
      - icy_images_data:/app/uploads/images
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/front/members"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [internal]

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,fr
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "2"
      OMP_NUM_THREADS: "2"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    expose: ["5000"]
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 200
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    networks: [internal, external]

  bot:
    image: iceforge/bot:local
    build:
      context: ./icy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      GUILD_ID: ${GUILD_ID:-}
      DISCORD_EVENTS_CHANNEL_ID: ${DISCORD_EVENTS_CHANNEL_ID:-}
      DISCORD_NEWS_CHANNEL_ID: ${DISCORD_NEWS_CHANNEL_ID:-}
      DISCORD_NOTIFICATIONS_CHANNEL_ID: ${DISCORD_NOTIFICATIONS_CHANNEL_ID:-}
      DISCORD_DISCUSSION_CHANNEL_ID: ${DISCORD_DISCUSSION_CHANNEL_ID:-}
      ENV_MODE: ${ENV_MODE:-production}
      BACKEND_API_URL: http://backend:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-icy}
      RABBITMQ_PSWD: ${RABBITMQ_PSWD:-change_me_local_only}
      BOT_API_KEY: ${BOT_API_KEY:-}
      VAULT_ENABLED: ${VAULT_ENABLED:-false}
      VAULT_ADDR: ${VAULT_ADDR:-http://vault:8200}
      VAULT_KV_MOUNT: ${VAULT_KV_MOUNT:-secret}
      VAULT_KV_PATH: ${BOT_VAULT_KV_PATH:-iceforge/dev/bot}
      VAULT_ROLE_ID: ${BOT_VAULT_ROLE_ID:-}
      VAULT_SECRET_ID: ${BOT_VAULT_SECRET_ID:-}
      VAULT_FAIL_FAST: ${VAULT_FAIL_FAST:-true}
    depends_on:
      backend:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - bot_config:/app/config
    networks: [internal]

  frontend:
    image: iceforge/frontend:local
    build:
      context: ./icy-angular
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose: ["8080"]
    volumes:
      - icy_images_data:/usr/share/nginx/html/images:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/index.html >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal, external]

  icy-images:
    image: nginx:1.30.6-alpine3.24@sha256:47928bf67eb62a1863cb08d9ecb52d3e704304ba614eaee17884204677702951
    restart: unless-stopped
    volumes:
      - icy_images_data:/usr/share/nginx/html/images:ro
    networks: [internal]

volumes:
  postgres18_data:
  rabbitmq_data:
  backend_logs:
  libretranslate_models:
  bot_config:
  icy_images_data:
    name: icy_images_data

networks:
  internal:
    name: iceforge_internal
    internal: true
  external:
    name: iceforge_external
    driver: bridge

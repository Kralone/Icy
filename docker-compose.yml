services:
  db:
    image: postgres:15
    container_name: iceforge_db
    restart: always
    environment:
      POSTGRES_USER: iceforge
      POSTGRES_PASSWORD: iceforgepassword
      POSTGRES_DB: iceforge_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build: ./backend
    container_name: iceforge_backend
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iceforge_db
      SPRING_DATASOURCE_USERNAME: iceforge
      SPRING_DATASOURCE_PASSWORD: iceforgepassword
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      - backend_logs:/app/logs
    networks:
      - internal
      - external

  bot:
    build: ./bot
    container_name: iceforge_bot
    restart: always
    environment:
      DISCORD_TOKEN: your_discord_token_here
      API_URL: http://backend:8080
    depends_on:
      - backend
    volumes:
      - bot_config:/app/config
    networks:
      - external

volumes:
  postgres_data:
    driver: local
  backend_logs:
    driver: local
  bot_config:
    driver: local

networks:
  internal:
    internal: true
  external:
    driver: bridge

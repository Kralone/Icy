server {
    listen 80;
    server_name iceforge.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name iceforge.fr;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8080;

    ssl_certificate /etc/letsencrypt/live/iceforge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iceforge.fr/privkey.pem;

    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri/index.html $uri /index.html =404;
    }
}

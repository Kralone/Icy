# Redirection HTTP -> HTTPS
server {
    listen 80;
    server_name iceforge.fr;
    return 301 https://$host$request_uri;
}

# HTTPS avec certificat Let's Encrypt
server {
    listen 443 ssl;
    server_name iceforge.fr;

    # Re-resolve Docker DNS for backend to avoid stale upstream IPs after container restart.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8080;

    ssl_certificate /etc/letsencrypt/live/iceforge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iceforge.fr/privkey.pem;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Caching des ressources statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location /assets/ {
        autoindex off;
        try_files $uri $uri/ =404;
    }

}

# Redirection HTTP -> HTTPS
server {
    listen 80;
    server_name iceforge.fr;
    return 301 https://$host$request_uri;
}

# HTTPS avec certificat Let's Encrypt
server {
    listen 443 ssl;
    server_name iceforge.fr;

    ssl_certificate /etc/letsencrypt/live/iceforge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iceforge.fr/privkey.pem;

    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Caching des ressources statiques
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    location /assets/ {
        autoindex off;
        try_files $uri $uri/ =404;
    }

}

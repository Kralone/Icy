server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8080;

    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        # Serve prerendered route files without Nginx's directory redirect,
        # which can drop a non-standard development port.
        try_files $uri/index.html $uri /index.html =404;
    }
}

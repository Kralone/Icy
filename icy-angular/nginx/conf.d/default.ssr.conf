# HTTP -> HTTPS
server {
    listen 8080;
    server_name iceforge.fr;
    return 301 https://$host$request_uri;
}

# HTTPS reverse proxy -> Angular SSR + backend APIs
server {
    listen 8443 ssl;
    server_name iceforge.fr;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $frontend_ssr_upstream frontend_ssr:4000;
    set $backend_upstream backend:8080;

    ssl_certificate /etc/letsencrypt/live/iceforge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iceforge.fr/privkey.pem;

    client_max_body_size 50M;

    # Shared image volume served directly by Nginx.
    root /usr/share/nginx/html;

    location /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://$frontend_ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
        proxy_pass http://$frontend_ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # Keep service worker files fresh.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        proxy_pass http://$frontend_ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        proxy_pass http://$frontend_ssr_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /login {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://$frontend_ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /icy {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://$frontend_ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ^~ /icy/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://$frontend_ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://$frontend_ssr_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

<!-- ================== PAGE VAISSEAUX (STYLE ICY corrigé) ================== -->
<div class="relative min-h-[calc(100vh-64px)] bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white">
  <app-loading-overlay [isLoading]="isLoading"></app-loading-overlay>

  <div [class.blur-sm]="isLoading" [class.pointer-events-none]="isLoading" class="transition duration-300">
    <!-- Header filtres + Ajouter -->
    <div class="flex flex-wrap justify-between items-center px-6 pt-6 pb-4 gap-3">
      <div class="flex flex-wrap items-center gap-3">
        <input
          [(ngModel)]="shipFilter"
          (ngModelChange)="onFilterChange()"
          type="text"
          placeholder="Rechercher un vaisseau…"
          class="w-64 px-4 py-2 text-sm rounded-lg border border-white/20 bg-white/10 backdrop-blur-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-cyan-400 focus:outline-none"
        />

        <div class="relative" appClickOutside (appClickOutside)="showBrandDropdown = false">
          <button
            type="button"
            (click)="showBrandDropdown = !showBrandDropdown"
            class="px-4 py-2 text-sm rounded-lg border border-white/20 bg-white/10 hover:bg-white/20 transition backdrop-blur-lg"
          >
            Marques
          </button>

          <div
            *ngIf="showBrandDropdown"
            class="absolute left-0 mt-2 w-56 bg-[#0d1b2a]/90 backdrop-blur-xl border border-white/20 rounded-xl shadow-lg z-20 p-3 max-h-64 overflow-y-auto"
          >
            <label
              *ngFor="let brand of brands"
              class="flex items-center gap-2 text-sm px-2 py-1 rounded hover:bg-white/20 cursor-pointer"
            >
              <input
                type="checkbox"
                [checked]="selectedBrands.includes(brand.name)"
                (change)="toggleBrand(brand.name)"
                class="text-cyan-400 accent-cyan-400"
              />
              {{ brand.name }}
            </label>
          </div>
        </div>
      </div>

      <button
        (click)="openModal()"
        class="px-4 py-2 text-sm rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold
               shadow-[0_0_12px_rgba(56,189,248,0.35)] hover:shadow-[0_0_20px_rgba(56,189,248,0.6)] transform hover:scale-105 transition"
      >
        + Ajouter
      </button>
    </div>

    <!-- Grille -->
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6">
      <div
        *ngFor="let ship of filteredShips"
        class="group relative bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-lg overflow-hidden transition transform hover:scale-105 hover:border-cyan-400"
      >
        <button
          (click)="deleteShip(ship.shipId)"
          class="absolute top-3 right-3 opacity-0 group-hover:opacity-100 transition-opacity duration-200 bg-black/30 hover:bg-red-600 text-white rounded-full p-2 shadow-lg"
          title="Supprimer"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <img [src]="ship.imageUrl" alt="{{ship.name}}" class="w-full h-40 object-cover" />

        <div class="p-4 space-y-1">
          <h2 class="text-lg font-semibold text-white">{{ ship.name }}</h2>
          <p class="text-sm text-gray-300">Fabricant : {{ ship.brand }}</p>
          <p class="text-sm text-gray-300">Rôle : {{ ship.focus }}</p>
          <p class="text-sm text-gray-300">Équipage : {{ ship.crew }}</p>
        </div>

        <div
          class="absolute bottom-3 right-3 px-3 py-1 rounded-full text-xs font-semibold border bg-white/10 border-white/20 backdrop-blur-md shadow-sm"
          [ngClass]="{
            'text-blue-400 border-blue-400': !ship.inGamePurchase && !ship.loaner,
            'text-green-400 border-green-400': ship.inGamePurchase,
            'text-yellow-400 border-yellow-400': ship.loaner
          }"
        >
          {{ ship.loaner ? 'Loaner' : ship.inGamePurchase ? 'In Game' : 'RSI' }}
        </div>
      </div>
    </div>

    <!-- Aucun vaisseau -->
    <div *ngIf="!isLoading && ships.length === 0" class="flex flex-col items-center justify-center h-96 text-gray-300">
      <svg class="w-12 h-12 mb-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20 21V7a2 2 0 0 0-2-2h-4.586a1 1 0 0 1-.707-.293l-1.414-1.414a1 1 0 0 0-.707-.293H6a2 2 0 0 0-2 2v16" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 17h6m-6-4h6m-6-4h6" />
      </svg>
      Aucun vaisseau enregistré pour le moment.
    </div>
  </div>
</div>

<!-- ================== MODAL AJOUT corrigé ================== -->
<div
  *ngIf="isModalOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xl px-4"
  (click)="closeModal()"
>
  <div
    class="relative w-full max-w-2xl bg-[#0d1b2a]/90 text-white backdrop-blur-2xl border border-white/20
           rounded-2xl shadow-[0_0_25px_rgba(56,189,248,0.35)] p-6"
    (click)="$event.stopPropagation()"
  >
    <button (click)="closeModal()" class="absolute top-3 right-3 text-gray-300 hover:text-white">✖</button>

    <div class="relative w-full h-64 mb-6 rounded-xl overflow-hidden shadow-lg ring-1 ring-white/20">
      <img *ngIf="selectedShipImageUrl" [src]="selectedShipImageUrl" alt="Vaisseau" class="w-full h-full object-cover" />
      <div *ngIf="!selectedShipImageUrl" class="w-full h-full grid place-items-center bg-white/5 text-gray-400">
        Aperçu du vaisseau
      </div>

      <img
        *ngIf="selectedBrandImageUrl"
        [src]="selectedBrandImageUrl"
        alt="Logo marque"
        class="absolute top-3 right-3 w-20 h-20 object-contain bg-white/20 rounded-full p-2 shadow-md"
      />
    </div>

    <!-- Sélection marque -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-1 text-cyan-200">Marque</label>
      <select
        [(ngModel)]="selectedBrand"
        (change)="onBrandChange()"
        class="w-full px-3 py-2 rounded-lg bg-[#1b263b]/70 border border-white/20 text-white focus:ring-2 focus:ring-cyan-400 outline-none"
      >
        <option *ngFor="let brand of brands" [value]="brand.name">{{ brand.name }}</option>
      </select>
    </div>

    <!-- Sélection vaisseau -->
    <div *ngIf="filteredShipsModal.length > 0" class="mb-4">
      <label class="block text-sm font-medium mb-1 text-cyan-200">Vaisseau</label>
      <select
        [(ngModel)]="selectedShip"
        (change)="onShipChange()"
        [compareWith]="compareShips"
        class="w-full px-3 py-2 rounded-lg bg-[#1b263b]/70 border border-white/20 text-white focus:ring-2 focus:ring-cyan-400 outline-none"
      >
        <option *ngFor="let ship of filteredShipsModal" [ngValue]="ship">{{ ship.name }}</option>
      </select>
    </div>

    <!-- Méthode d'acquisition -->
    <div class="mb-4">
      <label class="block text-sm font-medium mb-2 text-cyan-200">Méthode d’acquisition</label>
      <div class="flex flex-wrap gap-2">
        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'rsi'
          }"
        >
          <input type="radio" name="acquisition" value="rsi" [(ngModel)]="acquisitionType" class="sr-only" />
          Achat RSI
        </label>

        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'ingame'
          }"
        >
          <input type="radio" name="acquisition" value="ingame" [(ngModel)]="acquisitionType" class="sr-only" />
          Achat in-game
        </label>

        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'loaner'
          }"
        >
          <input type="radio" name="acquisition" value="loaner" [(ngModel)]="acquisitionType" class="sr-only" />
          Loaner
        </label>
      </div>
    </div>

    <!-- Bouton -->
    <div class="flex justify-end mt-6">
      <button
        (click)="onAddShip()"
        class="px-5 py-2 rounded-lg font-semibold bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500
               shadow-lg transition disabled:opacity-50"
      >
        Ajouter
      </button>
    </div>
  </div>
</div>

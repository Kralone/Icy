    <p class="text-xs uppercase tracking-[0.2em] text-cyan-300/70">Collections</p>
    <div class="mt-3 flex items-end justify-between">
      <span class="text-3xl font-semibold text-white">{{ totalCollections }}</span>
      <span class="text-xs text-slate-300">au total</span>
    </div>
  </div>
  <div class="rounded-2xl border border-white/10 bg-white/5 p-5 backdrop-blur-xl shadow-lg">

    <div class="mt-3 flex items-end justify-between">
      <span class="text-3xl font-semibold text-white">{{ completionPercent }}%</span>
      <span class="text-xs text-slate-300">global</span>
    </div>
  </div>
</section>

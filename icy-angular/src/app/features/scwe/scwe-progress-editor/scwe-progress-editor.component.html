<div class="bg-black/20 border border-white/10 rounded-3xl p-6 space-y-6">

  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div>
      <div class="font-bold text-xl text-white/90">Progression</div>
    </div>

    <div class="flex items-center gap-3">
      <span *ngIf="savedOk" class="text-sm font-medium text-emerald-300 bg-emerald-500/10 border border-emerald-400/20 px-3 py-1.5 rounded-full animate-pulse">
        ✅ Sauvegardé
      </span>

      <button
        (click)="save()"
        [disabled]="readonly || saving || !form"
        class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-cyan-600 to-blue-600
               hover:from-cyan-500 hover:to-blue-500 transition font-semibold text-white shadow-lg shadow-cyan-900/20 active:scale-95
               disabled:opacity-40 disabled:cursor-not-allowed disabled:shadow-none"
      >
        {{ saving ? 'Sync...' : 'Enregistrer' }}
      </button>
    </div>
  </div>

  <div *ngIf="error" class="text-red-300 bg-red-500/10 border border-red-400/20 rounded-2xl p-4">
    {{ error }}
  </div>

  <div *ngIf="!fields.length" class="text-white/60 italic">
    Aucun schéma de points disponible pour cet event.
  </div>

  <div *ngIf="form && fields.length" class="space-y-4">
    <div
      *ngFor="let f of fields; trackBy: trackByKey"
      class="bg-white/5 border border-white/10 rounded-2xl p-4 transition hover:bg-white/[0.07]"
    >
      <div class="flex items-center justify-between gap-4 mb-2">
        <div class="flex items-baseline gap-3 w-full justify-between md:justify-start">
          <div class="font-semibold text-cyan-100 text-lg">{{ f.label || f.key }}</div>

          <div class="text-xs font-mono"
               [class]="(form.controls[f.key].value || 0) >= (f.max || 999999) ? 'text-emerald-400' : 'text-cyan-400'">
            {{ form.controls[f.key].value }} <span class="text-white/20">/</span> {{ f.max ?? '∞' }}
          </div>
        </div>
      </div>

      <div class="flex flex-col-reverse md:flex-row md:items-center gap-4 md:gap-6 mt-2">

        <div class="relative flex-grow bg-white/10 rounded-full h-3 overflow-visible mt-2 mx-2 md:mt-0 md:mx-0 order-1 md:order-1">

          <ng-container *ngIf="f.max && ((form.controls[f.key].value || 0) / f.max * 100) as itemPercent">
            <div
              class="absolute top-0 left-0 h-3 rounded-full transition-all duration-500 ease-out z-10 pointer-events-none"
              [ngClass]="itemPercent >= 100
                      ? 'bg-gradient-to-r from-emerald-400 to-green-500 shadow-[0_0_8px_rgba(52,211,153,0.6)]'
                      : 'bg-gradient-to-r from-cyan-400 to-blue-500 shadow-[0_0_8px_rgba(34,211,238,0.4)]'"
              [style.width.%]="Math.min(100, itemPercent)"
            ></div>
          </ng-container>

          <ng-container *ngIf="f.max && f.milestones?.length">
            <div
              *ngFor="let m of f.milestones; let i = index; let isLast = last"
              class="absolute top-0 bottom-0 w-8 -ml-4 z-20 flex flex-col items-center justify-center group/marker cursor-pointer"
              [style.left.%]="(m.at / f.max) * 100"
              (click)="toggleMilestone(f.key + '-' + i, $event)"
            >
              <div class="w-0.5 h-full bg-white/40 shadow-[0_0_2px_rgba(255,255,255,0.8)] pointer-events-none"></div>

              <div *ngIf="(form.controls[f.key].value || 0) >= m.at"
                   class="absolute top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-emerald-400 border-2 border-black/60 shadow-[0_0_10px_#34d399] z-30 transition-transform duration-300 transform group-hover/marker:scale-125"
                   [class.scale-125]="activeMilestoneIndex === (f.key + '-' + i)">
              </div>

              <div class="absolute bottom-full mb-3 flex flex-col transition-opacity duration-200 pointer-events-none z-40"
                   [ngClass]="{
                     'opacity-0': activeMilestoneIndex !== (f.key + '-' + i),
                     'opacity-100': activeMilestoneIndex === (f.key + '-' + i),
                     'group-hover/marker:opacity-100': true,
                     'items-end right-0 translate-x-1.5': isLast,
                     'items-center left-1/2 -translate-x-1/2': !isLast
                   }">

                <div class="bg-black/95 text-white text-xs p-2 rounded-lg border border-white/20 shadow-xl flex flex-col items-center min-w-[140px] backdrop-blur-xl">

                  <img *ngIf="m.imageUrl"
                       [src]="m.imageUrl"
                       class="w-48 h-32 object-cover rounded border border-white/10 mb-2 bg-black/50"
                       alt="Reward" />

                  <div class="flex items-center justify-center gap-2 w-full px-1">
                    <div class="text-center whitespace-nowrap">
                      <span class="font-bold text-cyan-200 text-sm">{{ m.at }}</span>
                      <span *ngIf="m.label" class="text-white/70 ml-1">| {{ m.label }}</span>
                    </div>

                    <svg *ngIf="(form.controls[f.key].value || 0) >= m.at" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-emerald-400 shrink-0 drop-shadow-[0_0_8px_rgba(52,211,153,0.8)]">
                      <path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zm13.36-1.814a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clip-rule="evenodd" />
                    </svg>
                  </div>

                  <div *ngIf="m.reward" class="mt-2 pt-2 w-full border-t border-white/20 text-center">
                    <div class="text-[10px] text-white/50 uppercase tracking-widest mb-0.5">Récompense</div>
                    <div class="font-bold text-amber-300 text-sm drop-shadow-md">{{ m.reward }}</div>
                  </div>

                </div>

                <div class="w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-black/90"
                     [class.mr-4]="isLast"></div>
              </div>
            </div>
          </ng-container>

        </div>

        <div class="flex items-center justify-center gap-2 shrink-0 w-full md:w-auto order-2 md:order-2">
          <button
            type="button"
            (click)="step(f, -1)"
            [disabled]="readonly"
            class="h-10 w-10 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 hover:border-white/30 text-white transition active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center"
          >
            −
          </button>

          <input
            type="number"
            [formControl]="form.controls[f.key]"
            (input)="onManualInput(f)"
            class="w-20 h-10 px-2 rounded-xl bg-black/30 border border-white/20 text-white text-center font-mono text-base
         focus:outline-none focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-500 transition
         disabled:opacity-40 disabled:cursor-not-allowed
         [appearance:textfield] [&::-webkit-outer-spin-button]:appearance-none [&::-webkit-inner-spin-button]:appearance-none"
          />

          <button
            type="button"
            (click)="step(f, 1)"
            [disabled]="readonly"
            class="h-10 w-10 rounded-xl border border-white/15 bg-white/5 hover:bg-white/10 hover:border-white/30 text-white transition active:scale-95 disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center"
          >
            +
          </button>
        </div>

      </div>
    </div>
  </div>
</div>

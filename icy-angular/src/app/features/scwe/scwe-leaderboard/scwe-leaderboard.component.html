<div class="w-full space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">

  <div class="space-y-3">
    <div *ngFor="let p of participants; let i = index"
         class="bg-white/5 border border-white/10 rounded-2xl overflow-hidden transition-all duration-300 hover:bg-white/[0.08] hover:border-white/20">

      <div (click)="toggle(p.id)" class="p-4 flex items-center justify-between cursor-pointer group">
        <div class="flex items-center gap-4">
          <div
            class="w-10 h-10 flex items-center justify-center rounded-full font-bold text-lg bg-black/20 border border-white/10 shadow-inner overflow-hidden text-gray-200"
          >
            <img
              *ngIf="p.avatarUrl"
              [src]="p.avatarUrl"
              alt="Avatar"
              class="h-full w-full object-cover"
            />
            <span *ngIf="!p.avatarUrl">{{ getInitial(p.username) }}</span>
          </div>
          <div>
            <div class="font-bold text-lg text-white group-hover:text-cyan-200 transition">{{ p.username || 'Joueur Inconnu' }}</div>
            <div class="text-xs text-white/40 font-mono">Dernière maj: {{ p.updatedAt | date:'dd/MM HH:mm' }}</div>
          </div>
        </div>
        <div class="flex items-center gap-4 md:gap-8">
          <div class="text-right">
            <div class="text-2xl font-bold text-cyan-300">{{ p.total }}</div>
            <div class="text-[10px] text-white/40 uppercase tracking-wider">Points</div>
          </div>
          <svg class="w-6 h-6 text-white/30 transition-transform duration-300" [class.rotate-180]="expanded[p.id]" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </div>
      </div>

      <div class="border-t border-white/5 bg-black/20 transition-all duration-500 ease-in-out overflow-hidden"
           [class.max-h-0]="!expanded[p.id]" [class.max-h-[1000px]]="expanded[p.id]">
        <div class="p-6 space-y-6">
          <ng-container *ngIf="getGlobalMax(event.scoreSchema) as globalMax">
            <div class="space-y-1">
              <div class="flex justify-between text-xs text-white/50 mb-1">
                <span>Progression Globale</span>
                <span>{{ Math.round(((p.total || 0) / globalMax) * 100) }}%</span>
              </div>
              <div class="relative w-full bg-white/10 rounded-full h-3 shadow-inner">
                <div class="absolute top-0 left-0 h-3 rounded-full bg-gradient-to-r from-cyan-500 to-blue-600 shadow-[0_0_10px_rgba(6,182,212,0.4)]"
                     [style.width.%]="Math.min(100, ((p.total || 0) / globalMax) * 100)"></div>

                <ng-container *ngIf="event.scoreSchema?.total?.milestones as milestones">
                  <div *ngFor="let m of milestones" class="absolute top-0 bottom-0 w-0.5 bg-white/20 z-10" [style.left.%]="(m.at / globalMax) * 100">
                    <div *ngIf="(p.total || 0) >= m.at" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_5px_#34d399]"></div>
                  </div>
                </ng-container>
              </div>
            </div>
          </ng-container>

          <div *ngIf="event.scoreSchema?.fields" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-2">
            <div *ngFor="let field of event.scoreSchema.fields" class="bg-white/5 p-3 rounded-xl border border-white/5">
              <div class="flex justify-between items-end mb-2">
                <span class="text-sm font-bold text-white/80">{{ field.label }}</span>
                <span class="text-xs font-mono text-cyan-200">{{ getFieldValue(p, field.key) }} <span class="text-white/30">/ {{ field.max }}</span></span>
              </div>
              <div class="w-full bg-black/30 rounded-full h-1.5 overflow-hidden">
                <div class="h-full bg-cyan-500/70" [style.width.%]="Math.min(100, (getFieldValue(p, field.key) / field.max) * 100)"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

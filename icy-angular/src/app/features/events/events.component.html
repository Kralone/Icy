<div class="relative h-full min-h-[calc(100vh-64px)] bg-white dark:bg-gray-700 transition-colors duration-300 px-6 pt-6 pb-10">
  <!-- Titre + Bouton Ajouter -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">📅 Calendrier des événements</h1>
    <button
      class="text-sm text-white dark:text-gray-800 bg-gray-800 dark:bg-gray-200 border border-transparent hover:bg-gray-700 dark:hover:bg-gray-300 transition duration-200 transform hover:scale-105 cursor-pointer rounded px-4 py-2 shadow-sm"
    (click)="openModal()">
      + Ajouter
    </button>
  </div>

  <!-- FullCalendar -->
  <full-calendar [options]="calendarOptions" class="rounded-lg shadow-lg overflow-hidden bg-white dark:bg-gray-800 text-gray-800 dark:text-white p-4"></full-calendar>
</div>

<div *ngIf="showModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm px-4" (click)="closeModal()">
  <div class="bg-white dark:bg-gray-800 text-gray-800 dark:text-white rounded-lg shadow-xl w-full max-w-2xl p-6 relative" (click)="$event.stopPropagation()">
    <button (click)="closeModal()" class="absolute top-2 right-2 text-gray-400 hover:text-white text-xl">✖</button>

    <h2 class="text-2xl font-bold mb-4">Ajouter un événement</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm mb-1">Titre</label>
        <input [(ngModel)]="newEvent.title" type="text" class="w-full px-4 py-2 border rounded dark:bg-gray-700 dark:border-gray-600" />
      </div>

      <div>
        <label class="block text-sm mb-1">Type</label>
        <select [(ngModel)]="newEvent.type" class="w-full px-4 py-2 border rounded dark:bg-gray-700 dark:border-gray-600">
          <option value="" disabled selected hidden>Choisir un type</option>
          <option *ngFor="let type of eventTypes" [value]="type">{{ type }}</option>
        </select>
      </div>

      <div class="sm:col-span-2">
        <label class="block text-sm mb-1">Description</label>
        <textarea [(ngModel)]="newEvent.description" rows="3" class="w-full px-4 py-2 border rounded dark:bg-gray-700 dark:border-gray-600"></textarea>
      </div>

      <div>
        <label class="block text-sm mb-1">Début</label>
        <input [(ngModel)]="newEvent.startDateTime" type="datetime-local" class="w-full px-4 py-2 border rounded dark:bg-gray-700 dark:border-gray-600" />
      </div>

      <div>
        <label class="block text-sm mb-1">Fin</label>
        <input [(ngModel)]="newEvent.endDateTime" type="datetime-local" class="w-full px-4 py-2 border rounded dark:bg-gray-700 dark:border-gray-600" />
      </div>
    </div>

    <div class="flex justify-end mt-6">
      <button
        (click)="addEventToBackend()"
        [disabled]="isFormInvalid"
        class="px-4 py-2 rounded shadow-md font-semibold transition
         text-white dark:text-white
         bg-green-600 hover:bg-green-700
         disabled:bg-gray-300 dark:disabled:bg-gray-600
         disabled:text-gray-500 dark:disabled:text-gray-400
         disabled:cursor-not-allowed"
      >
        Ajouter
      </button>
    </div>
  </div>
</div>

<div class="relative h-full min-h-[calc(100vh-64px)] bg-white dark:bg-gray-700 transition-colors duration-300 px-6 pt-6 pb-10">
  <!-- Titre + Bouton Ajouter -->
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-gray-800 dark:text-white">📅 Calendrier des événements</h1>
    <button
      class="text-sm text-white dark:text-gray-800 bg-gray-800 dark:bg-gray-200 border border-transparent hover:bg-gray-700 dark:hover:bg-gray-300 transition duration-200 transform hover:scale-105 cursor-pointer rounded px-4 py-2 shadow-sm"
    >
      + Ajouter
    </button>
  </div>

  <!-- FullCalendar -->
  <full-calendar [options]="calendarOptions" class="rounded-lg shadow-lg overflow-hidden bg-white dark:bg-gray-800 text-gray-800 dark:text-white p-4"></full-calendar>
</div>

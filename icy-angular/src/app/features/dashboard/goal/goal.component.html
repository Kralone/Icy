<div
  class="relative dashboard-widget rounded-2xl p-4 sm:p-6 mb-6 bg-white/10 backdrop-blur-xl border border-white/20 shadow-lg text-white"
  [attr.data-loading]="isLoading"
>
  <app-loading-overlay
    [isLoading]="isLoading"
    [minDurationMs]="550"
    [fadeOutMs]="450"
    [softFade]="true"
  ></app-loading-overlay>
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-2xl sm:text-3xl font-bold text-cyan-300 drop-shadow-md text-center sm:text-left">
      🎯 Objectif actuel
    </h1>
    <a
      routerLink="/icy/goals"
      class="text-xs text-cyan-200 hover:text-white transition underline underline-offset-4"
    >
      Voir tous les objectifs
    </a>
  </div>

  <div *ngIf="!isLoading && goals.length === 0" class="text-center text-gray-400 italic">
    Aucun objectif défini.
  </div>

  <div
    *ngFor="let goal of goals"
    class="mb-8 p-4 sm:p-5 rounded-2xl bg-white/5 border border-white/20 shadow-inner"
  >
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-3">
      <h2 class="text-xl sm:text-2xl font-semibold text-cyan-200 text-center sm:text-left">
        {{ goal.name }}
      </h2>
      <span *ngIf="goal.completed" class="text-green-400 font-medium text-center sm:text-right">
        ✔ Terminé
      </span>
    </div>

    <p class="text-sm text-gray-300 mb-2 text-justify">{{ goal.description }}</p>
    <p class="text-xs text-gray-400 mb-4 text-center sm:text-left">
      Créé le {{ goal.createdAt | date:'medium' }}
    </p>

    <div class="relative w-full bg-white/10 rounded-full h-3 mb-6 overflow-visible">
      <div class="absolute inset-0 overflow-hidden rounded-full">
        <div
          class="absolute top-0 left-0 h-3 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 transition-all duration-900"
          [style.width.%]="getAnimatedProgress(goal)"
          [ngClass]="{ 'goal-progress--parent': goal.subGoals.length }"
        ></div>
      </div>
      <div
        class="absolute top-[calc(100%+6px)] text-sm font-bold text-cyan-300 drop-shadow-[0_0_8px_rgba(34,211,238,0.4)] transition-all duration-700 ease-out"
        [ngClass]="{
          'translate-x-0': getAnimatedLabelAlign(goal) === 'left',
          '-translate-x-1/2': getAnimatedLabelAlign(goal) === 'center',
          '-translate-x-full': getAnimatedLabelAlign(goal) === 'right'
        }"
        [style.left.%]="getAnimatedLabelLeft(goal)"
        style="transform: translateX(0);"
      >
        {{ getAnimatedProgress(goal) | number:'1.0-0' }}%
      </div>
    </div>

    <div class="mb-3">
      <div class="text-xs text-white/50 uppercase tracking-wider">Progression</div>
    </div>

    <div
      *ngIf="goal.subGoals && goal.subGoals.length > 0"
      class="mt-4 pl-4 border-l border-white/20"
    >
      <h3 class="text-lg font-semibold text-cyan-300 mb-3 text-center sm:text-left">
        Sous-objectifs
      </h3>

      <ng-container *ngFor="let sub of visibleSubGoals(goal)">
        <div class="mb-3">
          <div class="flex justify-between text-sm text-gray-300">
            <span>{{ sub.name }}</span>
            <span class="text-base font-semibold text-cyan-200">
              {{ sub.current }}/{{ sub.target }}
            </span>
          </div>

          <div class="relative w-full bg-white/10 rounded-full h-2 overflow-hidden">
            <div
              class="absolute top-0 left-0 h-2 rounded-full bg-gradient-to-r from-green-400 to-cyan-500 transition-all duration-500"
              [style.width.%]="calculateProgress(sub)"
            ></div>
          </div>
        </div>
      </ng-container>

      <div *ngIf="goal.subGoals.length > maxSubGoals" class="mt-2 text-center">
        <button
          type="button"
          class="text-xs text-cyan-200 hover:text-white transition underline underline-offset-4"
          (click)="toggleSubGoals(goal)"
        >
          {{ goal.__expanded ? 'Reduire la liste' : ('Afficher tout (' + goal.subGoals.length + ')') }}
        </button>
      </div>
    </div>
  </div>
</div>

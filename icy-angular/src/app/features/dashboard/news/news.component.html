<div
  class="rounded-2xl p-4 sm:p-6 mb-6 bg-white/10 backdrop-blur-xl border border-white/20 shadow-lg text-white"
>
  <h1 class="text-2xl sm:text-3xl font-bold text-cyan-300 tracking-wide drop-shadow-md mb-4 text-center sm:text-left">
    🧊 Actualités
  </h1>

  <div *ngIf="newsList.length > 0; else noNews" class="space-y-6">
    <div
      *ngFor="let n of newsList"
      class="relative flex flex-col md:flex-row overflow-hidden rounded-2xl border border-white/20 shadow-lg
             bg-gradient-to-br from-[#0d1b2a]/90 to-[#1b263b]/90
             hover:border-cyan-400 hover:shadow-cyan-400/30 transition-all duration-500 hover:scale-[1.01] group"
    >
      <!-- Image -->
      <div class="relative md:w-1/3 w-full h-40 sm:h-48 md:h-auto overflow-hidden">
        <img
          [src]="n.type?.imageUrl"
          alt="Image"
          class="absolute inset-0 w-full h-full object-cover transform transition-transform duration-[2000ms]
                 group-hover:scale-110 group-hover:translate-x-1"
        />
        <div class="absolute inset-0 bg-gradient-to-r from-[#0d1b2a]/60 via-transparent to-transparent"></div>

        <div
          class="absolute top-2 right-2 px-3 py-1 rounded-full text-xs font-semibold text-black shadow-md"
          [style.backgroundColor]="n.type?.color || '#38bdf8'"
        >
          {{ n.type?.name }}
        </div>
      </div>

      <!-- Contenu -->
      <div class="relative flex-1 p-4 flex flex-col justify-between bg-gradient-to-l from-transparent via-[#1b263b]/80 to-[#0d1b2a]/90">
        <div class="relative z-10">
          <h2 class="text-lg font-bold text-cyan-200 drop-shadow-lg mb-1">{{ n.title }}</h2>
          <p class="text-[11px] text-gray-400 mb-2">{{ n.createdAt | date: 'dd MMM yyyy' }}</p>
          <p class="text-gray-200 text-justify line-clamp-2" [innerHTML]="n.content"></p>
        </div>

        <div class="mt-3 flex justify-end relative z-10">
          <button
            (click)="openModal(n)"
            class="px-3 py-1.5 rounded-md bg-cyan-500/20 border border-cyan-400/50 text-cyan-300 text-sm hover:bg-cyan-500/30 transition-all"
          >
            Lire la suite →
          </button>
        </div>
      </div>
    </div>
  </div>

  <ng-template #noNews>
    <p class="text-gray-300 italic mt-4 text-center text-sm">
      Aucune actualité disponible pour le moment.
    </p>
  </ng-template>
</div>

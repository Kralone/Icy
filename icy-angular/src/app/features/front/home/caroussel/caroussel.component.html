<section class="front-section carousel-section">
  <div class="front-container">
    <div class="carousel-header">
      <h2 class="carousel-title">{{strings.join}}</h2>
      <p class="carousel-subtitle">Un flux d'escouades, de vaisseaux et d'expeditions en mouvement.</p>
    </div>
  </div>

  <div class="carousel-band">
    <div class="carousel-track">
      @for (image of carouselImages; track image) {
        <img [src]="image" alt="carousel image" loading="lazy" decoding="async" />
      }
      @for (image of carouselImages; track image) {
        <img [src]="image" alt="carousel image duplicate" loading="lazy" decoding="async" />
      }
    </div>
  </div>

  <div class="front-container networks-panel">
    <h2 class="networks-title">{{strings.networks}}</h2>

    <div class="networks-grid">

<section id="story" class="front-section story-merged">
  <div class="story-merged-grid">
    <article class="story-panel story-panel--intro">
      <div class="story-copy">
        <h2 class="story-title">
          {{strings.mainTitle}}
        </h2>
        <div class="story-line"></div>
        <p class="story-text" [innerHTML]="strings.mainParagraph"></p>
      </div>

      <div class="story-media" appFadeInOnScroll>
        <div class="story-media__frame">
          <img
            src="assets/images/home/space-journey.webp"
            alt="Histoire de la Corpo"
            loading="lazy"
            decoding="async"
            />
          </div>
          @if (staggeredImages.length > 0) {
            <div class="story-media__mini">
              <img
                [src]="staggeredImages[0]"
                alt="Vue complementaire"
                loading="lazy"
                decoding="async"
                />
              </div>
            }
          </div>
        </article>

        <article class="story-panel story-panel--foundation">
          <div class="foundation-card">
            <h2 class="foundation-title">
              {{strings.sectionTitle}}
            </h2>
            <p class="foundation-text" [innerHTML]="strings.sectionParagraph"></p>
            <p class="foundation-text" [innerHTML]="strings.sectionParagraph2"></p>
          </div>

          <div class="foundation-stack">
            @for (image of staggeredImages.slice(1); track image; let i = $index) {
              <img
                [src]="image"
                alt="image"
                class="foundation-stack__image"
                loading="lazy"
                decoding="async"
                [style.animationDelay.ms]="i * 70"
                />
              }
            </div>
          </article>
        </div>
      </section>

<section id="story" class="front-section story-intro">
  <div class="front-container">
    <div class="story-grid">
      <div class="story-copy">
        <h2 class="story-title">
          {{strings.mainTitle}}
        </h2>
        <div class="story-line"></div>
        <p class="story-text" [innerHTML]="strings.mainParagraph"></p>
      </div>

      <div class="story-media" appFadeInOnScroll>
        <div class="story-media__frame">
          <img
            src="assets/images/home/space-journey.webp"
            alt="Histoire de la Corpo"
          />
        </div>
      </div>
    </div>
  </div>
</section>

<section class="front-section story-foundation">
  <div class="front-container foundation-grid">
    <div class="foundation-card">
      <h2 class="foundation-title">
        {{strings.sectionTitle}}
      </h2>
      <p class="foundation-text" [innerHTML]="strings.sectionParagraph"></p>
      <p class="foundation-text" [innerHTML]="strings.sectionParagraph2"></p>
    </div>

    <div
      class="foundation-stack"
      [ngStyle]="{ height: isDesktop ? (staggeredImages.length * 160 + 'px') : null }"
    >
      <ng-container *ngFor="let image of staggeredImages; let i = index">
        <img
          [src]="image"
          alt="image"
          class="foundation-stack__image"
          [ngClass]="{
            'foundation-stack__image--left': i % 2 === 0,
            'foundation-stack__image--right': i % 2 !== 0,
            'foundation-stack__image--shift': i > 0
          }"
          [style.zIndex]="10 - i"
          [style.top.px]="isDesktop ? i * 160 : null"
        />
      </ng-container>
    </div>
  </div>
</section>

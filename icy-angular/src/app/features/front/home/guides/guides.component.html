<div class="guides-shell">
  <header class="guides-header">
    <h2>Guides IceForge</h2>
  </header>

  <div class="guides-grid">
    @for (card of cards; track card.id) {
        <a class="guide-card guide-card--live guide-card--clickable" [routerLink]="card.route">
          <div class="guide-card__media guide-card__media--live" aria-hidden="true">
            <img class="guide-card__image" [src]="card.imageUrl" [alt]="card.title" loading="lazy" decoding="async" />
            <div class="guide-card__hover-glow"></div>
            <span class="guide-card__status">{{ card.type === 'écriture' ? 'Ecriture' : 'Disponible' }}</span>
          </div>
          <div class="guide-card__content">
            <h3>{{ card.title }}</h3>
            <p>{{ card.summary }}</p>
            <div class="guide-card__meta">
              <span>{{ card.category }}</span>
            </div>
          </div>
        </a>
    }
  </div>
</div>

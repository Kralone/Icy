<div class="p-8 space-y-10 min-h-screen bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white">

  <!-- === SECTION 1 : Ajouter un événement === -->
  <div class="flex items-center justify-between">
    <a
      routerLink="/icy/events"
      class="text-sm text-gray-300 hover:text-white inline-flex items-center gap-1 transition"
    >
      <span class="text-lg">←</span> Retour au calendrier
    </a>
  </div>

  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 shadow-2xl space-y-6">
    <h1 class="text-2xl font-bold text-cyan-300">Ajouter un événement</h1>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <!-- Titre -->
      <div>
        <label class="block text-sm mb-1 text-gray-300">Titre</label>
        <input
          [(ngModel)]="newEvent.title"
          type="text"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
          placeholder="Nom de l’événement"
        />
      </div>

      <!-- Type -->
      <div>
        <label class="block text-sm mb-1 text-gray-300">Type</label>
        <select
          [(ngModel)]="newEvent.type"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition
                 [class.text-gray-400]='!newEvent.type'"
        >
          <option value="" disabled selected hidden>Choisir un type</option>
          <option *ngFor="let type of types" [value]="type.name" class="bg-[#1e293b] text-white">
            {{ type.name }}
          </option>
        </select>
      </div>

      <!-- Description -->
      <div class="sm:col-span-2">
        <label class="block text-sm mb-1 text-gray-300">Description</label>
        <textarea
          [(ngModel)]="newEvent.description"
          rows="3"
          placeholder="Détails de l’événement..."
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition resize-none"
        ></textarea>
      </div>

      <!-- Début -->
      <div>
        <label class="block text-sm mb-1 text-gray-300">Début</label>
        <input
          [(ngModel)]="newEvent.startDateTime"
          type="datetime-local"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <!-- Fin -->
      <div>
        <label class="block text-sm mb-1 text-gray-300">Fin</label>
        <input
          [(ngModel)]="newEvent.endDateTime"
          type="datetime-local"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>
    </div>

    <div class="flex justify-end mt-8">
      <button
        (click)="createEvent()"
        [disabled]="isFormInvalid"
        class="px-5 py-2 rounded-lg font-semibold shadow-md bg-gradient-to-r from-cyan-500 to-blue-600
               hover:from-cyan-400 hover:to-blue-500 text-white transition transform hover:scale-105
               disabled:opacity-40 disabled:cursor-not-allowed"
      >
        {{ isSubmitting ? 'Création…' : 'Ajouter' }}
      </button>
    </div>
  </div>

  <!-- === SECTION 2 : Types d'événements === -->
  <section class="space-y-8">
    <h2 class="text-xl font-bold text-cyan-300">Types d'événements</h2>

    <!-- Formulaire -->
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
        <input
          [(ngModel)]="newType.name"
          placeholder="Nom du type"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
        <input
          [(ngModel)]="newType.textColor"
          placeholder="Couleur texte (#fff)"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
        <input
          [(ngModel)]="newType.backgroundColor"
          placeholder="Couleur fond (#123abc)"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
        <input
          [(ngModel)]="newType.imageUrl"
          placeholder="URL image (optionnel)"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="flex justify-end">
        <button
          (click)="createType()"
          [disabled]="isTypeSubmitting"
          class="inline-flex items-center gap-2 rounded-lg bg-gradient-to-r from-cyan-500 to-blue-600
                 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold px-4 py-2 shadow-md
                 transition transform hover:scale-105 disabled:opacity-60"
        >
          <ng-container *ngIf="!isTypeSubmitting; else loadingIcon">
            ➕ Ajouter le type
          </ng-container>
          <ng-template #loadingIcon>
            <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                 viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10"
                      stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
          </ng-template>
        </button>
      </div>
    </div>

    <!-- Tableau -->
    <div class="overflow-hidden rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-xl">
      <table class="min-w-full divide-y divide-white/10">
        <thead class="bg-white/10 text-cyan-300 uppercase tracking-wider">
        <tr>
          <th class="px-4 py-3 text-left">Nom</th>
          <th class="px-4 py-3 text-left">Texte</th>
          <th class="px-4 py-3 text-left">Fond</th>
          <th class="px-4 py-3 text-left">Image</th>
          <th class="px-4 py-3 text-right">Action</th>
        </tr>
        </thead>

        <tbody>
        <tr
          *ngFor="let type of types"
          class="hover:bg-white/10 transition duration-200 border-b border-white/10"
        >
          <td class="px-4 py-3 font-medium">{{ type.name }}</td>

          <td class="px-4 py-3">
            <div class="flex items-center gap-2">
                <span
                  class="inline-block w-5 h-5 rounded-full border border-white/20"
                  [style.backgroundColor]="type.textColor"
                ></span>
              <span>{{ type.textColor }}</span>
            </div>
          </td>

          <td class="px-4 py-3">
            <div class="flex items-center gap-2">
                <span
                  class="inline-block w-5 h-5 rounded-full border border-white/20"
                  [style.backgroundColor]="type.backgroundColor"
                ></span>
              <span>{{ type.backgroundColor }}</span>
            </div>
          </td>

          <td class="px-4 py-3">
            <img
              *ngIf="type.imageUrl; else noImage"
              [src]="type.imageUrl"
              alt="aperçu"
              class="w-40 h-16 rounded-lg border border-white/20 object-cover"
            />
            <ng-template #noImage>
              <span class="text-gray-400 italic">–</span>
            </ng-template>
          </td>

          <td class="px-4 py-3 text-right space-x-3">
            <button
              type="button"
              (click)="editType(type)"
              class="text-yellow-400 hover:text-yellow-300 transition"
            >
              ✏️ Modifier
            </button>
            <button
              type="button"
              (click)="deleteType(type.name)"
              class="text-red-400 hover:text-red-300 transition"
            >
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- === MODAL MODIFICATION TYPE === -->
  <div *ngIf="editingType" class="fixed inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm z-50">
    <div class="bg-white/10 backdrop-blur-2xl border border-white/20 rounded-2xl shadow-2xl w-full max-w-md p-8 relative text-white">
      <h3 class="text-2xl font-semibold mb-6 text-cyan-300">Modifier le type d’événement</h3>

      <div class="space-y-4">
        <input
          [(ngModel)]="editingType.name"
          readonly
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-gray-400 cursor-not-allowed"
        />
        <input
          [(ngModel)]="editingType.textColor"
          placeholder="Couleur du texte (#fff)"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
        <input
          [(ngModel)]="editingType.backgroundColor"
          placeholder="Couleur du fond (#000)"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
        <input
          [(ngModel)]="editingType.imageUrl"
          placeholder="URL image"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="flex justify-end gap-4 pt-6">
        <button
          type="button"
          (click)="cancelEdit()"
          class="text-gray-400 hover:text-white transition"
        >
          Annuler
        </button>
        <button
          type="button"
          (click)="updateType()"
          [disabled]="isTypeUpdating"
          class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
                 text-white px-5 py-2 rounded-lg font-semibold shadow-md transition disabled:opacity-60"
        >
          {{ isTypeUpdating ? 'Mise à jour…' : 'Sauvegarder' }}
        </button>
      </div>
    </div>
  </div>
</div>

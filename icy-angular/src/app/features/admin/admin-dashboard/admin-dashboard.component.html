<!-- ================== ADMIN USERS - STYLE ICY ================== -->
<div class="min-h-screen w-full bg-gradient-to-b from-[#0a111c] via-[#0f172a] to-[#111827] text-white p-6 sm:p-10 space-y-8">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
    <input
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      type="text"
      placeholder="🔍 Rechercher un utilisateur..."
      class="w-full sm:w-1/3 px-4 py-2 rounded-xl bg-[#0b1324] border border-white/10
             text-white placeholder-gray-500 shadow-inner focus:outline-none focus:ring-2 focus:ring-cyan-400
             transition"
    />

    <button
      (click)="isAddUserModalOpen = true"
      class="bg-gradient-to-r from-cyan-400 to-sky-500 hover:from-cyan-300 hover:to-sky-400
             text-slate-900 font-semibold px-6 py-2 rounded-full shadow-[0_18px_40px_rgba(0,255,255,0.2)]
             transition transform hover:scale-[1.02] w-full sm:w-auto"
    >
      + Ajouter un membre
    </button>
  </div>

  <!-- Tableau responsive -->
  <div class="overflow-x-auto rounded-2xl bg-white/5 border border-white/10 shadow-[0_25px_60px_rgba(0,0,0,0.35)]">
    <table class="min-w-[700px] w-full text-sm text-gray-200">
      <thead class="bg-[#0b1324] text-cyan-200 uppercase tracking-[0.2em] border-b border-white/10">
      <tr>
        <th class="px-4 py-3 text-left cursor-pointer select-none" (click)="sortBy('username')">
          Nom
          <span class="ml-1 opacity-70" *ngIf="sortColumn === 'username'">{{ sortAsc ? '▲' : '▼' }}</span>
        </th>
        <th class="px-4 py-3 text-left">Discord ID</th>
        <th class="px-4 py-3 text-left">Rôles</th>
        <th class="px-4 py-3 text-left">Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr
        *ngFor="let user of paginatedUsers"
        class="hover:bg-white/5 transition duration-200 border-b border-white/10"
      >
        <td class="px-4 py-3 font-medium break-words">{{ user.username }}</td>
        <td class="px-4 py-3 break-all">{{ user.discordId }}</td>
        <td class="px-4 py-3">
          <span
            *ngFor="let role of user.roles"
            class="inline-block bg-gradient-to-r from-cyan-600 to-blue-700 text-white text-xs px-2 py-1 rounded-full mr-1 shadow-sm whitespace-nowrap"
          >
            {{ roleLabels[role] || role }}
          </span>
        </td>
        <td class="px-4 py-3 flex flex-wrap gap-2">
          <button class="px-3 py-1 rounded-full border border-white/10 hover:border-cyan-400/40 transition" (click)="editUser(user)">Modifier</button>
          <button class="px-3 py-1 rounded-full border border-red-400/40 text-red-300 hover:border-red-400/70 transition" (click)="deleteUser(user.id)">Supprimer</button>
          <button class="px-3 py-1 rounded-full border border-white/10 hover:border-cyan-400/40 transition" (click)="resetPassword(user.id)">Reset PW</button>
        </td>
      </tr>

      <tr *ngIf="isLoading">
        <td colspan="4" class="py-6 text-center">
          <app-loading-overlay [isLoading]="true"></app-loading-overlay>
        </td>
      </tr>

      <tr *ngIf="!isLoading && filteredUsers.length === 0">
        <td colspan="4" class="py-8 text-center text-gray-300">
          Aucun utilisateur trouvé.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 text-sm">
    <div class="flex items-center gap-2">
      <label class="text-slate-400">Éléments par page :</label>
      <select
        [(ngModel)]="itemsPerPage"
        (ngModelChange)="onPageSizeChange()"
        class="px-2 py-1 bg-[#0b1324] border border-white/10 rounded-full text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-400"
      >
        <option *ngFor="let size of [10, 20, 30]" [ngValue]="size">{{ size }}</option>
      </select>
    </div>

    <div class="space-x-2 flex items-center">
      <button
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="px-3 py-1 bg-[#0b1324] border border-white/10 rounded-full disabled:opacity-40 hover:border-cyan-400/40 transition"
      >
        Préc.
      </button>

      <span>Page {{ currentPage }} / {{ totalPages }}</span>

      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages || totalPages === 0"
        class="px-3 py-1 bg-[#0b1324] border border-white/10 rounded-full disabled:opacity-40 hover:border-cyan-400/40 transition"
      >
        Suiv.
      </button>
    </div>
  </div>
</div>

<!-- ================== MODAL ================== -->
<div
  *ngIf="isAddUserModalOpen"
  class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4"
  (click)="closeModal()"
>
  <div
    class="bg-[#0b1324] border border-white/10 rounded-2xl shadow-[0_28px_60px_rgba(0,0,0,0.6)] w-full max-w-md p-6 sm:p-8 relative text-white"
    (click)="$event.stopPropagation()"
  >
    <button (click)="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl">
      ✖
    </button>

    <h2 class="text-2xl font-semibold mb-6 text-cyan-200">
      {{ isEditMode ? 'Modifier un utilisateur' : 'Ajouter un utilisateur' }}
    </h2>

    <!-- Formulaire -->
    <form (ngSubmit)="isEditMode ? updateUser() : addUser()" #addUserForm="ngForm" class="space-y-4">

      <!-- Username -->
      <div>
        <label class="block mb-1 text-sm text-slate-300">Nom</label>
        <input
          type="text"
          name="username"
          placeholder="Nom"
          [(ngModel)]="newUser.username"
          class="w-full px-4 py-2 bg-[#0b1324] border border-white/10 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-cyan-400 outline-none"
          required
        />
      </div>

      <!-- Discord ID -->
      <div>
        <label class="block mb-1 text-sm text-slate-300">Discord ID</label>
        <input
          type="text"
          name="discordId"
          placeholder="0123456789"
          [(ngModel)]="newUser.discordId"
          class="w-full px-4 py-2 bg-[#0b1324] border border-white/10 rounded-xl text-white placeholder-gray-500 focus:ring-2 focus:ring-cyan-400 outline-none"
          required
        />
      </div>

      <!-- Rôle -->
      <div>
        <label class="block mb-1 text-sm text-slate-300">Rôle</label>
        <select
          name="role"
          [(ngModel)]="newUser.role"
          class="w-full px-4 py-2 bg-[#0b1324] border border-white/10 rounded-xl text-white focus:ring-2 focus:ring-cyan-400 outline-none"
          required
        >
          <option class="bg-[#1b263b]" *ngFor="let role of availableRoles" [value]="role">
            {{ roleLabels[role] || role }}
          </option>
        </select>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-4 pt-6">
        <button
          type="button"
          class="px-4 py-2 rounded-full border border-white/10 text-gray-300 hover:border-cyan-400/40 transition"
          (click)="closeModal()"
        >
          Annuler
        </button>

        <button
          type="submit"
          [disabled]="addUserForm.invalid"
          class="bg-gradient-to-r from-cyan-400 to-sky-500 hover:from-cyan-300 hover:to-sky-400
                 text-slate-900 px-5 py-2 rounded-full font-semibold shadow-md transition"
        >
          {{ isEditMode ? 'Modifier' : 'Ajouter' }}
        </button>
      </div>
    </form>
  </div>
</div>

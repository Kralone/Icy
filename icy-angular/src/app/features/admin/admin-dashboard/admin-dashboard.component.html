<!-- ================== ADMIN USERS - STYLE ICY ================== -->
<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white p-4 sm:p-8 space-y-8">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4">
    <input
      [(ngModel)]="searchTerm"
      (ngModelChange)="onSearchChange()"
      type="text"
      placeholder="🔍 Rechercher un utilisateur..."
      class="w-full sm:w-1/3 px-4 py-2 rounded-xl bg-white/10 backdrop-blur-lg border border-white/20
             text-white placeholder-gray-400 shadow-inner focus:outline-none focus:ring-2 focus:ring-cyan-400
             transition"
    />

    <button
      (click)="isAddUserModalOpen = true"
      class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
             text-white font-semibold px-5 py-2 rounded-xl shadow-lg transition transform hover:scale-105 w-full sm:w-auto"
    >
      + Ajouter un membre
    </button>
  </div>

  <!-- Tableau responsive -->
  <div class="overflow-x-auto rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-xl icy-scrollbar">
    <table class="min-w-[700px] w-full text-sm text-gray-200">
      <thead class="bg-white/10 text-cyan-300 uppercase tracking-wider border-b border-white/10">
      <tr>
        <th class="px-4 py-3 text-left cursor-pointer select-none" (click)="sortBy('username')">
          Nom
          <span class="ml-1 opacity-70" *ngIf="sortColumn === 'username'">{{ sortAsc ? '▲' : '▼' }}</span>
        </th>
        <th class="px-4 py-3 text-left">Discord ID</th>
        <th class="px-4 py-3 text-left">Rôles</th>
        <th class="px-4 py-3 text-left">Actions</th>
      </tr>
      </thead>

      <tbody>
      <tr
        *ngFor="let user of paginatedUsers"
        class="hover:bg-white/10 transition duration-200 border-b border-white/10"
      >
        <td class="px-4 py-3 font-medium break-words">{{ user.username }}</td>
        <td class="px-4 py-3 break-all">{{ user.discordId }}</td>
        <td class="px-4 py-3">
          <span
            *ngFor="let role of user.roles"
            class="inline-block bg-gradient-to-r from-cyan-600 to-blue-700 text-white text-xs px-2 py-1 rounded-full mr-1 shadow-sm whitespace-nowrap"
          >
            {{ role }}
          </span>
        </td>
        <td class="px-4 py-3 flex flex-wrap gap-2">
          <button class="text-blue-400 hover:text-blue-300 transition" (click)="editUser(user)">✏️ Modifier</button>
          <button class="text-red-400 hover:text-red-300 transition" (click)="deleteUser(user.id)">🗑️ Supprimer</button>
          <button class="text-yellow-400 hover:text-yellow-300 transition" (click)="resetPassword(user.id)">🔁 Reset PW</button>
        </td>
      </tr>

      <tr *ngIf="isLoading">
        <td colspan="4" class="py-6 text-center">
          <app-loading-overlay [isLoading]="true"></app-loading-overlay>
        </td>
      </tr>

      <tr *ngIf="!isLoading && filteredUsers.length === 0">
        <td colspan="4" class="py-8 text-center text-gray-300">
          Aucun utilisateur trouvé.
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex flex-col sm:flex-row justify-between items-center gap-3 pt-4 text-sm">
    <div class="flex items-center gap-2">
      <label class="text-gray-300">Éléments par page :</label>
      <select
        [(ngModel)]="itemsPerPage"
        (ngModelChange)="onPageSizeChange()"
        class="px-2 py-1 bg-white/10 border border-white/20 rounded text-gray-200 focus:outline-none focus:ring-2 focus:ring-cyan-400"
      >
        <option *ngFor="let size of [10, 20, 30]" [ngValue]="size">{{ size }}</option>
      </select>
    </div>

    <div class="space-x-2 flex items-center">
      <button
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        class="px-3 py-1 bg-white/10 border border-white/20 rounded disabled:opacity-40 hover:bg-white/20 transition"
      >
        Préc.
      </button>

      <span>Page {{ currentPage }} / {{ totalPages }}</span>

      <button
        (click)="nextPage()"
        [disabled]="currentPage === totalPages || totalPages === 0"
        class="px-3 py-1 bg-white/10 border border-white/20 rounded disabled:opacity-40 hover:bg-white/20 transition"
      >
        Suiv.
      </button>
    </div>
  </div>
</div>

<!-- ================== MODAL ================== -->
<div
  *ngIf="isAddUserModalOpen"
  class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4"
  (click)="closeModal()"
>
  <div
    class="bg-white/10 backdrop-blur-2xl border border-white/20 rounded-2xl shadow-2xl w-full max-w-md p-6 sm:p-8 relative text-white"
    (click)="$event.stopPropagation()"
  >
    <button (click)="closeModal()" class="absolute top-3 right-3 text-gray-400 hover:text-white text-xl">
      ✖
    </button>

    <h2 class="text-2xl font-semibold mb-6 text-cyan-300">
      {{ isEditMode ? 'Modifier un utilisateur' : 'Ajouter un utilisateur' }}
    </h2>

    <!-- Formulaire -->
    <form (ngSubmit)="isEditMode ? updateUser() : addUser()" #addUserForm="ngForm" class="space-y-4">

      <!-- Username -->
      <div>
        <label class="block mb-1 text-sm text-gray-300">Nom</label>
        <input
          type="text"
          name="username"
          placeholder="Nom"
          [(ngModel)]="newUser.username"
          class="w-full px-4 py-2 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-cyan-400 outline-none"
          required
        />
      </div>

      <!-- Discord ID -->
      <div>
        <label class="block mb-1 text-sm text-gray-300">Discord ID</label>
        <input
          type="text"
          name="discordId"
          placeholder="0123456789"
          [(ngModel)]="newUser.discordId"
          class="w-full px-4 py-2 bg-white/10 border border-white/20 rounded-lg text-white placeholder-gray-400 focus:ring-2 focus:ring-cyan-400 outline-none"
          required
        />
      </div>

      <!-- Rôle -->
      <div>
        <label class="block mb-1 text-sm text-gray-300">Rôle</label>
        <select
          name="role"
          [(ngModel)]="newUser.role"
          class="w-full px-4 py-2 bg-gradient-to-r from-cyan-600/30 to-blue-700/30 border border-white/20 rounded-lg text-white focus:ring-2 focus:ring-cyan-400 outline-none"
          required
        >
          <option class="bg-[#1b263b]" *ngFor="let role of availableRoles" [value]="role">{{ role }}</option>
        </select>
      </div>

      <!-- Actions -->
      <div class="flex justify-end gap-4 pt-6">
        <button
          type="button"
          class="text-gray-400 hover:text-white transition"
          (click)="closeModal()"
        >
          Annuler
        </button>

        <button
          type="submit"
          [disabled]="addUserForm.invalid"
          class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
                 text-white px-5 py-2 rounded-lg font-semibold shadow-md transition"
        >
          {{ isEditMode ? 'Modifier' : 'Ajouter' }}
        </button>
      </div>
    </form>
  </div>
</div>

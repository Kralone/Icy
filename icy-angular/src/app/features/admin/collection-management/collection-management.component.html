<div class="p-6 space-y-8">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <a routerLink="/icy/collection"
       class="text-sm text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white inline-flex items-center gap-1">
      <span class="text-lg">←</span> Retour aux collections
    </a>
  </div>

  <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">
    Créer un nouveau template
  </h1>

  <!-- Form -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm mb-1">Nom du template</label>
      <input [(ngModel)]="newTemplate.name"
             type="text"
             class="w-full px-3 py-2 border rounded dark:bg-slate-800 dark:border-slate-700" />
    </div>

    <div>
      <label class="block text-sm mb-1">Archétype</label>
      <input [(ngModel)]="newTemplate.archetype"
             type="text"
             class="w-full px-3 py-2 border rounded dark:bg-slate-800 dark:border-slate-700" />
    </div>
  </div>

  <!-- Axes -->
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">

    <!-- Axe X -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Axe X</h2>
        <button (click)="addAxisValue('x')"
                type="button"
                class="text-xs text-white bg-blue-600 hover:bg-blue-700 rounded px-3 py-1.5 transition">
          + Ajouter
        </button>
      </div>

      <div class="space-y-2">
        <div *ngFor="let val of newTemplate.axisX; let i = index; trackBy: trackByIndex"
             class="flex items-center gap-2">
          <input [(ngModel)]="val.label" placeholder="Label"
                 class="flex-1 px-2 py-1.5 border rounded text-sm dark:bg-slate-800 dark:border-slate-700" />
          <button (click)="removeAxisValue('x', i)"
                  type="button"
                  class="text-xs px-2 py-1.5 rounded border border-red-400 text-red-600 hover:bg-red-50 dark:border-red-600 dark:text-red-400 dark:hover:bg-red-950/40 transition">
            Suppr
          </button>
        </div>
      </div>
    </div>

    <!-- Axe Y -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="font-semibold">Axe Y</h2>
        <button (click)="addAxisValue('y')"
                type="button"
                class="text-xs text-white bg-blue-600 hover:bg-blue-700 rounded px-3 py-1.5 transition">
          + Ajouter
        </button>
      </div>

      <div class="space-y-2">
        <div *ngFor="let val of newTemplate.axisY; let i = index; trackBy: trackByIndex"
             class="flex items-center gap-2">
          <input [(ngModel)]="val.label" placeholder="Label"
                 class="flex-1 px-2 py-1.5 border rounded text-sm dark:bg-slate-800 dark:border-slate-700" />
          <button (click)="removeAxisValue('y', i)"
                  type="button"
                  class="text-xs px-2 py-1.5 rounded border border-red-400 text-red-600 hover:bg-red-50 dark:border-red-600 dark:text-red-400 dark:hover:bg-red-950/40 transition">
            Suppr
          </button>
        </div>
      </div>
    </div>

  </section>

  <!-- Aperçu -->
  <section class="space-y-3">
    <h3 class="font-semibold">Aperçu du tableau</h3>

    <div class="overflow-auto">
      <table class="min-w-full border border-slate-300 dark:border-slate-700 text-sm">
        <thead>
        <tr class="bg-slate-100 dark:bg-slate-800">
          <th class="px-3 py-2 text-left">Y \\ X</th>
          <th *ngFor="let x of newTemplate.axisX"
              class="px-3 py-2 text-left">
            {{ x.label || '—' }}
          </th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let y of newTemplate.axisY"
            class="border-t border-slate-200 dark:border-slate-700">
          <th class="px-3 py-2 text-left font-medium">{{ y.label || '—' }}</th>
          <td *ngFor="let _ of newTemplate.axisX"
              class="px-3 py-2 text-center border-l border-slate-200 dark:border-slate-700">
            ⬜
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>

  <!-- Action -->
  <div class="flex justify-end pt-2">
    <button (click)="createTemplate()"
            type="button"
            [disabled]="!canCreate"
            class="px-4 py-2 rounded bg-green-600 hover:bg-green-700 text-white font-semibold transition disabled:opacity-60">
      {{ isSubmitting ? 'Création…' : 'Créer' }}
    </button>
  </div>
</div>

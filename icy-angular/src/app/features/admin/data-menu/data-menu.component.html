<section class="data-menu">
  <header class="data-menu-heading">
    <h1>Catalogue</h1>
    <nav aria-label="Navigation du catalogue">
      <a routerLink="/icy/admin">← Administration</a>
      <a routerLink="/icy/admin/catalog">Tout le catalogue</a>
      <a routerLink="/icy/admin/uex-cache">Synchronisation</a>
    </nav>
  </header>
  <div class="data-menu-grid">
    @for (item of menuItems; track item.label) {
      <section class="data-menu-card">
        <a class="data-menu-card-main" [routerLink]="item.route" [queryParams]="item.queryParams">
          <img [src]="item.imageUrl" alt="" loading="lazy" (error)="$any($event.target).style.display = 'none'" />
          <h2>{{ item.label }}</h2><span aria-hidden="true">↗</span>
        </a>
        @if (item.shortcuts?.length) {
          <nav class="data-menu-shortcuts" [attr.aria-label]="item.label">
            @for (shortcut of item.shortcuts; track shortcut.label) {
              <a routerLink="/icy/admin/catalog" [queryParams]="{family: shortcut.family, catalogGroup: shortcut.catalogGroup || 'STANDARD'}">{{ shortcut.label }}</a>
            }
          </nav>
        }
      </section>
    }
  </div>
</section>

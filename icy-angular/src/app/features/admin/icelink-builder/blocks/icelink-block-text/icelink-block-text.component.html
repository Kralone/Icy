<div
  class="relative w-full h-full bg-white/10 border border-white/20 rounded-lg p-3
         backdrop-blur-xl transition-all duration-300 ease-in-out
         focus-within:border-cyan-400/60 focus-within:shadow-[0_0_20px_#22d3ee]/30"
  >
  <div class="flex items-center justify-between mb-2">
    <div class="flex items-center gap-1">
      <span class="text-base">{{ block.icon }}</span>
      <span class="font-semibold text-sm text-cyan-300">{{ block.name }}</span>
    </div>
    @if (!isEditing) {
      <span
        class="text-gray-400 text-xs hover:text-cyan-300 transition cursor-pointer"
        (click)="startEditing()"
        >✏️</span
        >
      }
    </div>

    <div
      contenteditable="true"
      [innerText]="block.content"
      (input)="onInput($event)"
      (blur)="stopEditing()"
    class="outline-none text-[13px] leading-snug text-white/90 whitespace-pre-wrap break-words
           min-h-[60px] caret-cyan-300"
    ></div>
  </div>

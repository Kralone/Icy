<div
  class="p-8 space-y-6 min-h-screen bg-gradient-to-b from-[#0a111c] via-[#0f172a] to-[#111827] text-white flex flex-col"
>
  <app-icelink-header
    (onReset)="reset()"
    (onSave)="save()"
  ></app-icelink-header>

  <app-icelink-dropzone
    [blocks]="icelinkBlocks"
    (onBlockRemoved)="blocksPanel.addBlock($event)"
    class="mt-2"
  ></app-icelink-dropzone>

  <!-- ✅ Conteneur preview + blocks avec hauteur fixe et enfants scrollables -->
  <div class="flex flex-col lg:flex-row gap-4 mt-4 h-[70vh] min-h-0 overflow-hidden">
    <app-icelink-preview
      [blocks]="icelinkBlocks"
      class="flex-[3] min-h-0 overflow-hidden"
    ></app-icelink-preview>

    <app-icelink-block-panel
      #blocksPanel
      class="flex-1 min-h-0 overflow-hidden"
    ></app-icelink-block-panel>
  </div>

  <app-icelink-block-admin (onBlockDeleted)="handleBlockDeleted($event)"></app-icelink-block-admin>

</div>

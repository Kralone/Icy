<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white p-8 space-y-10">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <h2 class="text-3xl font-semibold text-cyan-300">🎯 Admin – Objectifs</h2>
  </div>

  <!-- ===================== FORM (en haut) ===================== -->
  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-6 shadow-xl space-y-6">

    <div class="flex items-center justify-between gap-3">
      <div class="text-lg font-semibold text-cyan-200">
        {{ editingGoal ? '✏️ Édition' : '➕ Création' }}
      </div>

      <button
        *ngIf="editingGoal"
        (click)="resetForm()"
        class="px-4 py-2 rounded-xl border border-white/20 bg-white/5 hover:bg-white/10
               transition active:scale-95"
      >
        Annuler
      </button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

      <div>
        <label class="text-sm text-gray-300">Nom</label>
        <input
          [(ngModel)]="form.name"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div>
        <label class="text-sm text-gray-300">Cible</label>
        <input
          type="number" min="1"
          [(ngModel)]="form.target"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div>
        <label class="text-sm text-gray-300">Actuel</label>
        <input
          type="number" min="0"
          [(ngModel)]="form.current"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="lg:col-span-3">
        <label class="text-sm text-gray-300">Description</label>
        <textarea
          [(ngModel)]="form.description"
          class="w-full min-h-[90px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        ></textarea>
      </div>

      <div>
        <label class="text-sm text-gray-300">Objectif principal</label>
        <select
          [(ngModel)]="selectedRootId"
          (change)="onRootParentChange()"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-[#1b263b]/70 border border-white/20 text-cyan-100
                 focus:ring-2 focus:ring-cyan-400 outline-none transition"
        >
          <option [ngValue]="null">— Aucun —</option>
          <option *ngFor="let g of rootGoals" [ngValue]="g.id">{{ g.name }}</option>
        </select>
      </div>

      <div>
        <label class="text-sm text-gray-300">Sous-objectif parent</label>
        <select
          [(ngModel)]="form.parentId"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-[#1b263b]/70 border border-white/20 text-cyan-100
                 focus:ring-2 focus:ring-cyan-400 outline-none transition"
        >
          <option [ngValue]="selectedRootId" [disabled]="!selectedRootId">
            — Directement sous le parent —
          </option>
          <option *ngFor="let sg of subGoalsForSelectedRoot" [ngValue]="sg.id">
            {{ sg.name }}
          </option>
        </select>
      </div>

      <div class="flex items-end">
        <button
          (click)="form.pinned = !form.pinned"
          class="w-full min-h-[44px] rounded-xl border font-semibold transition
                 hover:brightness-110 active:scale-95"
          [ngClass]="{
            'bg-cyan-500/20 border-cyan-400/30 text-cyan-200 hover:bg-cyan-500/25': form.pinned,
            'bg-white/5 border-white/20 text-white/70 hover:bg-white/10': !form.pinned
          }"
        >
          📌 {{ form.pinned ? 'Épinglé' : 'Non épinglé' }}
        </button>
      </div>

    </div>

    <div class="flex justify-end">
      <button
        (click)="createOrUpdateGoal()"
        class="px-6 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600
               hover:from-cyan-400 hover:to-blue-500 transition font-semibold
               active:scale-95"
      >
        {{ editingGoal ? 'Mettre à jour' : '+ Ajouter' }}
      </button>
    </div>
  </div>

  <!-- ===================== LIST ===================== -->
  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-xl overflow-hidden">

    <div *ngFor="let root of paginatedRoots" class="border-b border-white/10">

      <!-- ROOT ROW -->
      <div
        class="flex items-center justify-between px-4 py-3 cursor-pointer
               transition-all duration-200
               hover:bg-white/10 hover:shadow-[0_0_20px_rgba(56,189,248,0.08)]
               active:scale-[0.995]"
        (click)="toggleRoot(root)"
      >
        <div class="flex items-center gap-3">
          <ng-container *ngIf="!isRootOpen(root); else openIcon">
            <svg class="w-4 h-4 text-cyan-300" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6l6 6-6 6" />
            </svg>
          </ng-container>
          <ng-template #openIcon>
            <svg class="w-4 h-4 text-cyan-300" viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 10l6 6 6-6" />
            </svg>
          </ng-template>

          <span class="font-semibold tracking-wide">{{ root.name }}</span>

          <span *ngIf="root.pinned"
                class="text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 text-cyan-200 border border-cyan-400/30">
            📌
          </span>

          <span *ngIf="isDone(root)"
                class="text-xs px-2 py-0.5 rounded-full bg-white/10 text-white/60 border border-white/20">
            Terminé
          </span>
        </div>

        <div class="flex gap-2">
          <button
            (click)="editGoal(root); $event.stopPropagation()"
            class="px-2 py-1 rounded-lg border border-white/15 bg-white/5
                   hover:bg-white/10 hover:border-white/25 transition active:scale-95"
            title="Éditer"
          >
            ✏️
          </button>

          <button
            (click)="deleteGoal(root.id, root.name); $event.stopPropagation()"
            class="px-2 py-1 rounded-lg border border-white/15 bg-white/5
                   hover:bg-red-500/15 hover:border-red-400/30 transition active:scale-95"
            title="Supprimer"
          >
            🗑️
          </button>
        </div>
      </div>

      <!-- CHILDREN -->
      <div *ngIf="isRootOpen(root)" class="bg-white/5 border-t border-white/10">
        <div
          *ngFor="let node of getVisibleTree(root)"
          class="flex items-center justify-between px-4 py-2 border-t border-white/10
                 transition-all duration-200 hover:bg-white/10 active:scale-[0.995]"
          [style.paddingLeft.px]="40 + (node.depth - 1) * 18"
        >
          <div class="flex items-center gap-2">
            <span class="text-white/35">↳</span>
            <span class="text-white/85">{{ node.goal.name }}</span>

            <span *ngIf="node.goal.pinned"
                  class="text-xs px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-200 border border-cyan-400/30">📌</span>

            <span *ngIf="isDone(node.goal)"
                  class="text-xs px-2 py-0.5 rounded bg-white/10 text-white/60 border border-white/20">Terminé</span>
          </div>

          <div class="flex gap-2">
            <button
              (click)="editGoal(node.goal); $event.stopPropagation()"
              class="px-2 py-1 rounded-lg border border-white/15 bg-white/5
                     hover:bg-white/10 hover:border-white/25 transition active:scale-95"
              title="Éditer"
            >
              ✏️
            </button>
            <button
              (click)="deleteGoal(node.goal.id, node.goal.name); $event.stopPropagation()"
              class="px-2 py-1 rounded-lg border border-white/15 bg-white/5
                     hover:bg-red-500/15 hover:border-red-400/30 transition active:scale-95"
              title="Supprimer"
            >
              🗑️
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Pagination -->
  <div class="flex justify-center items-center gap-4 text-gray-300">
    <button
      (click)="prevPage()"
      [disabled]="currentPage === 1"
      class="px-4 py-2 bg-white/10 border border-white/20 rounded-xl
             hover:bg-white/20 transition disabled:opacity-40 active:scale-95"
      title="Page précédente"
    >
      ❮
    </button>

    <span class="text-white/70">Page <span class="text-cyan-200 font-semibold">{{ currentPage }}</span> / {{ totalPages }}</span>

    <button
      (click)="nextPage()"
      [disabled]="currentPage === totalPages"
      class="px-4 py-2 bg-white/10 border border-white/20 rounded-xl
             hover:bg-white/20 transition disabled:opacity-40 active:scale-95"
      title="Page suivante"
    >
      ❯
    </button>
  </div>

</div>

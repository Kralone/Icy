<div class="space-y-8">

  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-6 shadow-xl space-y-6">
    <div class="flex items-center justify-between gap-3 flex-wrap">
      <div class="text-lg font-semibold text-cyan-200">
        {{ editingEvent ? '✏️ Édition Event' : '➕ Création Event' }}
      </div>

      <div class="flex items-center gap-3 flex-wrap">
        <button
          (click)="loadEvents(0)"
          class="px-4 py-2 rounded-xl border border-white/20 bg-white/5 hover:bg-white/10 transition active:scale-95"
        >
          🔄 Rafraîchir
        </button>

        <button
          *ngIf="editingEvent"
          (click)="createNew()"
          class="px-4 py-2 rounded-xl border border-white/20 bg-white/5 hover:bg-white/10 transition active:scale-95"
        >
          Annuler
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

      <div class="lg:col-span-2">
        <label class="text-sm text-gray-300">Titre</label>
        <input
          [(ngModel)]="eventForm.title"
          placeholder="Alliance Aid - Première initiative"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 placeholder:text-white/40
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div>
        <label class="text-sm text-gray-300">Type</label>
        <select
          [(ngModel)]="eventForm.typeName"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-[#1b263b]/70 border border-white/20 text-cyan-100
                 focus:ring-2 focus:ring-cyan-400 outline-none transition"
        >
          <option *ngFor="let t of types" [ngValue]="t.name">{{ t.name }}</option>
        </select>
      </div>

      <div>
        <label class="text-sm text-gray-300">Start</label>
        <input
          type="datetime-local"
          [(ngModel)]="eventForm.startAtLocal"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div>
        <label class="text-sm text-gray-300">End (optionnel)</label>
        <input
          type="datetime-local"
          [(ngModel)]="eventForm.endAtLocal"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="lg:col-span-3">
        <label class="text-sm text-gray-300">Image (banner)</label>
        <input
          [(ngModel)]="eventForm.bannerImageUrl"
          placeholder="https://... ou /img/sc/banner.png"
          class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 placeholder:text-white/40
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="lg:col-span-3">
        <label class="text-sm text-gray-300">Description</label>
        <textarea
          [(ngModel)]="eventForm.description"
          placeholder="Décris l’événement, les objectifs, les récompenses…"
          class="w-full min-h-[90px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                 placeholder:text-white/40
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        ></textarea>
      </div>

      <div class="lg:col-span-3">
        <label class="text-sm text-gray-300">Gallery (JSON)</label>
        <textarea
          [(ngModel)]="eventForm.gallery"
          placeholder='[{"url":"https://...","caption":"..."}]'
          class="w-full min-h-[160px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-mono text-sm
                 placeholder:text-white/40
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        ></textarea>
      </div>

    </div>

    <div class="flex justify-end">
      <button
        (click)="saveEvent()"
        class="px-6 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
               transition font-semibold active:scale-95"
      >
        {{ editingEvent ? 'Mettre à jour' : '+ Ajouter' }}
      </button>
    </div>
  </div>

  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-xl overflow-hidden">
    <div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
      <div class="text-white/80 font-semibold">Liste</div>
      <button
        (click)="loadEvents(0)"
        class="px-3 py-2 rounded-xl bg-white/5 border border-white/20 hover:bg-white/10 transition active:scale-95"
      >
        Charger
      </button>
    </div>

    <div *ngFor="let e of events" class="border-b border-white/10 last:border-0">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between px-4 py-4 hover:bg-white/10 transition gap-4">

        <div class="flex items-start sm:items-center gap-4 w-full">
          <div class="w-full sm:w-16 h-24 sm:h-12 rounded-xl bg-white/5 border border-white/15 overflow-hidden flex items-center justify-center shrink-0">
            <img *ngIf="e.bannerImageUrl" [src]="e.bannerImageUrl" class="w-full h-full object-cover" />
            <span *ngIf="!e.bannerImageUrl" class="text-white/40 text-xs">BANNER</span>
          </div>

          <div class="flex-grow min-w-0">
            <div class="font-semibold tracking-wide flex flex-wrap items-center gap-2 text-white">
              <span class="truncate">{{ e.title }}</span>
              <span *ngIf="!isEventActive(e)" class="text-[10px] bg-white/10 px-2 py-0.5 rounded text-white/50 border border-white/10 whitespace-nowrap">Clôturé</span>
            </div>
            <div class="text-xs text-white/60 mt-1 flex flex-col sm:flex-row sm:items-center gap-1 sm:gap-0">
              <span class="font-bold mr-2" [style.color]="e.typeTextColor || '#67e8f9'">{{ e.typeName }}</span>
              <span class="hidden sm:inline mx-1">•</span>
              <span class="font-mono">{{ e.startAt | date:'dd/MM/yyyy HH:mm' }}</span>
              <span *ngIf="e.endAt"> ➔ {{ e.endAt | date:'dd/MM/yyyy HH:mm' }}</span>
            </div>
          </div>
        </div>

        <div class="flex gap-2 self-end sm:self-auto shrink-0">
          <button
            *ngIf="isEventActive(e)"
            (click)="closeEvent(e)"
            class="h-9 px-3 rounded-lg border border-yellow-500/30 bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-200 transition active:scale-95 flex items-center"
            title="Clôturer maintenant"
          >🏁</button>

          <button
            (click)="editEvent(e)"
            class="h-9 px-3 rounded-lg border border-white/15 bg-white/5 hover:bg-white/10 hover:border-white/25 transition active:scale-95 flex items-center"
            title="Éditer"
          >✏️</button>

          <button
            (click)="deleteEvent(e)"
            class="h-9 px-3 rounded-lg border border-white/15 bg-white/5 hover:bg-red-500/15 hover:border-red-400/30 transition active:scale-95 flex items-center"
            title="Supprimer"
          >🗑️</button>
        </div>
      </div>
    </div>
  </div>

  <div class="flex justify-center items-center gap-4 text-gray-300">
    <button
      (click)="prevPage()"
      [disabled]="(eventsPage?.number ?? 0) === 0"
      class="px-4 py-2 bg-white/10 border border-white/20 rounded-xl hover:bg-white/20 transition disabled:opacity-40 active:scale-95"
    >
      ❮
    </button>

    <span class="text-white/70">
      Page <span class="text-cyan-200 font-semibold">{{ (eventsPage?.number ?? 0) + 1 }}</span>
      / {{ eventsPage?.totalPages ?? 1 }}
    </span>

    <button
      (click)="nextPage()"
      [disabled]="((eventsPage?.number ?? 0) + 1) >= (eventsPage?.totalPages ?? 1)"
      class="px-4 py-2 bg-white/10 border border-white/20 rounded-xl hover:bg-white/20 transition disabled:opacity-40 active:scale-95"
    >
      ❯
    </button>
  </div>

</div>

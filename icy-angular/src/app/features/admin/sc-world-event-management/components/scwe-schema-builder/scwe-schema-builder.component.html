<div class="space-y-4">

  <div class="flex items-center justify-between gap-3 flex-wrap">
    <div class="font-semibold text-white/90">Format de points</div>

    <div class="flex gap-2 bg-white/5 border border-white/15 rounded-2xl p-1">
      <button
        type="button"
        (click)="switchTab('form')"
        class="px-3 py-2 rounded-xl transition active:scale-95"
        [ngClass]="tab === 'form'
          ? 'bg-cyan-500/20 border border-cyan-400/30 text-cyan-200'
          : 'text-white/70 hover:bg-white/10'"
      >
        🧩 Formulaire
      </button>

      <button
        type="button"
        (click)="switchTab('json')"
        class="px-3 py-2 rounded-xl transition active:scale-95"
        [ngClass]="tab === 'json'
          ? 'bg-cyan-500/20 border border-cyan-400/30 text-cyan-200'
          : 'text-white/70 hover:bg-white/10'"
      >
        &#123;&#125; JSON
      </button>
    </div>
  </div>

  <!-- ===================== FORM TAB ===================== -->
  <div *ngIf="tab === 'form'" class="space-y-6">

    <div class="flex items-center justify-between">
      <div class="font-semibold text-white/90">Colonnes (fields)</div>
      <button
        type="button"
        (click)="addField()"
        class="px-4 py-2 rounded-xl bg-white/5 border border-white/20 hover:bg-white/10 transition active:scale-95"
      >
        + Ajouter une colonne
      </button>
    </div>

    <div class="space-y-4">
      <div *ngFor="let f of local.fields; let i = index"
           class="bg-white/5 border border-white/15 rounded-2xl p-4 space-y-4">

        <div class="flex items-center justify-between gap-3">
          <div class="font-semibold text-cyan-200">Field #{{ i + 1 }}</div>

          <button
            type="button"
            (click)="removeField(i)"
            class="h-9 w-9 rounded-xl border border-white/15 bg-white/5
                   hover:bg-red-500/15 hover:border-red-400/30 transition active:scale-95
                   flex items-center justify-center text-sm"
            title="Supprimer la colonne"
          >🗑️</button>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
          <div>
            <label class="text-xs text-white/60">Label</label>
            <input
              [(ngModel)]="f.label"
              (ngModelChange)="onFieldLabelChange(f)"
              (blur)="onAnyBlur()"
              placeholder="Combat"
              class="w-full min-h-[42px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <div>
            <label class="text-xs text-white/60">Key</label>
            <input
              [(ngModel)]="f.key"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="combat"
              class="w-full min-h-[42px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-mono
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <div>
            <label class="text-xs text-white/60">Min</label>
            <input
              type="number"
              [(ngModel)]="f.min"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="0"
              class="w-full min-h-[42px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <div>
            <label class="text-xs text-white/60">Max</label>
            <input
              type="number"
              [(ngModel)]="f.max"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="10000"
              class="w-full min-h-[42px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>
        </div>

        <div class="flex items-center justify-between">
          <div class="text-sm text-white/80">Paliers (milestones)</div>
          <button
            type="button"
            (click)="addFieldMilestone(i)"
            class="px-3 py-2 rounded-xl bg-white/5 border border-white/20 hover:bg-white/10 transition active:scale-95"
          >
            + Palier
          </button>
        </div>

        <div class="space-y-3">
          <div *ngFor="let m of f.milestones; let j = index"
               class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-2 items-end bg-white/5 border border-white/10 rounded-2xl p-3">

            <div>
              <label class="text-xs text-white/60">At</label>
              <input
                type="number"
                [(ngModel)]="m.at"
                (ngModelChange)="onAnyChange()"
                (blur)="onAnyBlur()"
                placeholder="8000"
                class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                       placeholder:text-white/40
                       focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
              />
            </div>

            <div class="lg:col-span-2">
              <label class="text-xs text-white/60">Label</label>
              <input
                [(ngModel)]="m.label"
                (ngModelChange)="onAnyChange()"
                (blur)="onAnyBlur()"
                placeholder="Phase 2"
                class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                       placeholder:text-white/40
                       focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
              />
            </div>

            <div class="lg:col-span-2">
              <label class="text-xs text-white/60">Image URL</label>
              <input
                [(ngModel)]="m.imageUrl"
                (ngModelChange)="onAnyChange()"
                (blur)="onAnyBlur()"
                placeholder="/img/sc/combat_8k.png"
                class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                       placeholder:text-white/40
                       focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
              />
            </div>

            <div>
              <label class="text-xs text-white/60">Reward</label>
              <input
                [(ngModel)]="m.reward"
                (ngModelChange)="onAnyChange()"
                (blur)="onAnyBlur()"
                placeholder="Badge (optionnel)"
                class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                       placeholder:text-white/40
                       focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
              />
            </div>

            <button
              type="button"
              (click)="removeFieldMilestone(i, j)"
              class="h-[40px] w-[40px] rounded-xl border border-white/15 bg-white/5
                     hover:bg-red-500/15 hover:border-red-400/30 transition active:scale-95
                     flex items-center justify-center text-sm"
              title="Supprimer"
            >
              🗑️
            </button>

          </div>
        </div>

      </div>
    </div>

    <!-- Total -->
    <div class="bg-white/5 border border-white/15 rounded-2xl p-4 space-y-4">
      <div class="font-semibold text-white/90">Total</div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="text-xs text-white/60">Mode</label>
          <select
            [(ngModel)]="local.total.mode"
            (ngModelChange)="onAnyChange()"
            (blur)="onAnyBlur()"
            class="w-full min-h-[44px] px-4 py-2 rounded-xl bg-[#1b263b]/70 border border-white/20 text-cyan-100
                   focus:ring-2 focus:ring-cyan-400 outline-none transition"
          >
            <option [ngValue]="'sum'">sum</option>
          </select>
        </div>

        <div>
          <label class="text-xs text-white/60">Keys incluses</label>
          <select
            multiple
            [(ngModel)]="local.total.keys"
            (change)="onAnyChange(); onAnyBlur()"
            class="w-full min-h-[120px] px-4 py-2 rounded-xl bg-[#1b263b]/70 border border-white/20 text-cyan-100
                   focus:ring-2 focus:ring-cyan-400 outline-none transition"
          >
            <option *ngFor="let f of local.fields" [ngValue]="f.key">{{ f.label || f.key }}</option>
          </select>
          <div class="text-xs text-white/50 mt-1">Astuce : ctrl/cmd pour multi-sélection.</div>
        </div>
      </div>

      <div class="flex items-center justify-between">
        <div class="text-sm text-white/80">Paliers globaux</div>
        <button
          type="button"
          (click)="addTotalMilestone()"
          class="px-3 py-2 rounded-xl bg-white/5 border border-white/20 hover:bg-white/10 transition active:scale-95"
        >
          + Palier
        </button>
      </div>

      <div class="space-y-3">
        <div *ngFor="let m of local.total.milestones; let j = index"
             class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-2 items-end bg-white/5 border border-white/10 rounded-2xl p-3">

          <div>
            <label class="text-xs text-white/60">At</label>
            <input
              type="number"
              [(ngModel)]="m.at"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="10000"
              class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <div class="lg:col-span-2">
            <label class="text-xs text-white/60">Label</label>
            <input
              [(ngModel)]="m.label"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="Global OK"
              class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <div class="lg:col-span-2">
            <label class="text-xs text-white/60">Image URL</label>
            <input
              [(ngModel)]="m.imageUrl"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="/img/sc/total_done.png"
              class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <div>
            <label class="text-xs text-white/60">Reward</label>
            <input
              [(ngModel)]="m.reward"
              (ngModelChange)="onAnyChange()"
              (blur)="onAnyBlur()"
              placeholder="Récompense (optionnel)"
              class="w-full min-h-[40px] px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white
                     placeholder:text-white/40
                     focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
            />
          </div>

          <button
            type="button"
            (click)="removeTotalMilestone(j)"
            class="h-[40px] w-[40px] rounded-xl border border-white/15 bg-white/5
                   hover:bg-red-500/15 hover:border-red-400/30 transition active:scale-95
                   flex items-center justify-center text-sm"
            title="Supprimer"
          >
            🗑️
          </button>

        </div>
      </div>
    </div>

  </div>

  <!-- ===================== JSON TAB ===================== -->
  <div *ngIf="tab === 'json'" class="bg-white/5 border border-white/15 rounded-2xl p-4">
    <div class="text-sm text-white/70 mb-2">JSON généré automatiquement (lecture seule).</div>
    <textarea
      [ngModel]="generatedJson"
      readonly
      class="w-full min-h-[340px] px-4 py-2 rounded-xl bg-white/10 border border-white/20 text-white font-mono text-sm
             placeholder:text-white/40
             focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
    ></textarea>
  </div>

</div>

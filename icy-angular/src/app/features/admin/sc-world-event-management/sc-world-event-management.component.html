<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white p-8 space-y-10">

  <!-- Header -->
  <div class="flex items-center justify-between gap-4 flex-wrap">
    <h2 class="text-3xl font-semibold text-cyan-300">🛰️ Admin – SC World Events</h2>

    <!-- Tabs -->
    <div class="flex gap-2 bg-white/5 border border-white/15 rounded-2xl p-1">
      <button
        (click)="switchTab('events')"
        class="px-4 py-2 rounded-xl transition active:scale-95"
        [ngClass]="tab === 'events' ? 'bg-cyan-500/20 border border-cyan-400/30 text-cyan-200' : 'text-white/70 hover:bg-white/10'"
      >
        Events
      </button>
      <button
        (click)="switchTab('types')"
        class="px-4 py-2 rounded-xl transition active:scale-95"
        [ngClass]="tab === 'types' ? 'bg-cyan-500/20 border border-cyan-400/30 text-cyan-200' : 'text-white/70 hover:bg-white/10'"
      >
        Types & Schema
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div *ngIf="error" class="bg-red-500/10 border border-red-400/20 rounded-2xl p-4 text-red-200">
    ⚠️ {{ error }}
  </div>
  <div *ngIf="success" class="bg-emerald-500/10 border border-emerald-400/20 rounded-2xl p-4 text-emerald-200">
    ✅ {{ success }}
  </div>

  <!-- Content -->
  <app-scwe-events-admin
    *ngIf="tab === 'events'"
    [types]="types"
    (message)="setMessage($event)"
  ></app-scwe-events-admin>

  <app-scwe-types-admin
    *ngIf="tab === 'types'"
    [types]="types"
    (typesUpdated)="reloadTypes()"
    (message)="setMessage($event)"
  ></app-scwe-types-admin>

</div>

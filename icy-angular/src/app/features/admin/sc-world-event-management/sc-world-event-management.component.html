<div class="sw-page">
  <div class="sw-wrap">
    <a routerLink="/icy/admin" class="sw-back"><span aria-hidden="true">←</span> Retour au tableau de bord</a>

    <header class="sw-head">
      <div>
        <p class="sw-kicker">Administration</p>
        <h1 class="sw-title">SC World Events</h1>
      </div>
      <div class="sw-tabs" role="tablist" aria-label="Sections">
        <button type="button" role="tab" class="sw-tab" [class.sw-tab--on]="tab === 'events'" [attr.aria-selected]="tab === 'events'" (click)="switchTab('events')">Événements</button>
        <button type="button" role="tab" class="sw-tab" [class.sw-tab--on]="tab === 'types'" [attr.aria-selected]="tab === 'types'" (click)="switchTab('types')">Types et barème</button>
      </div>
    </header>

    @if (error) { <p class="sw-alert" role="alert">{{ error }}</p> }
    @if (success) { <p class="sw-alert sw-alert--ok" role="status">{{ success }}</p> }

    @if (tab === 'events') {
      <app-scwe-events-admin [types]="types" (message)="setMessage($event)"></app-scwe-events-admin>
    }
    @if (tab === 'types') {
      <app-scwe-types-admin [types]="types" (typesUpdated)="reloadTypes()" (message)="setMessage($event)"></app-scwe-types-admin>
    }
  </div>
</div>

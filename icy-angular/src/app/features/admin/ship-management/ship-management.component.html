<!-- ================== ICY - VAISSEAUX & MARQUES ================== -->
<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white p-8 space-y-16">

  <!-- ===================== VAISSEAUX ===================== -->
  <section class="space-y-8">
    <div class="flex items-center justify-between">
      <h2 class="text-3xl font-semibold text-cyan-300">🚀 Vaisseaux</h2>
    </div>

    <!-- Formulaire d’ajout -->
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-6 shadow-2xl space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <!-- Nom -->
        <input
          [(ngModel)]="newShip.name"
          placeholder="Nom du vaisseau"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />

        <!-- Marque -->
        <select
          [(ngModel)]="newShip.brand"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20
         text-white focus:outline-none focus:ring-2 focus:ring-cyan-400 transition
         [class.text-gray-400]='!newShip.brand'"
        >
          <option value="" disabled selected hidden>Choisir une marque...</option>
          <option *ngFor="let brand of brands" [value]="brand.name" class="text-white bg-[#1e293b]">
            {{ brand.name }}
          </option>
        </select>




        <!-- Image -->
        <input
          [(ngModel)]="newShip.imageUrl"
          placeholder="URL de l’image"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="flex justify-end">
        <button
          (click)="createOrUpdateShip()"
          [disabled]="isSubmittingShip"
          class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
                 text-white font-semibold px-5 py-2 rounded-xl shadow-lg transition transform hover:scale-105
                 disabled:opacity-50"
        >
          {{ editingShip ? 'Mettre à jour' : '+ Ajouter un vaisseau' }}
        </button>
      </div>
    </div>

    <!-- Tableau des vaisseaux -->
    <div class="overflow-hidden rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-xl">
      <table class="min-w-full text-sm text-gray-200">
        <thead class="bg-white/10 text-cyan-300 uppercase tracking-wider border-b border-white/10">
        <tr>
          <th class="px-4 py-3 text-left">Nom</th>
          <th class="px-4 py-3 text-left">Marque</th>
          <th class="px-4 py-3 text-left">Image</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr
          *ngFor="let ship of paginatedShips.slice((shipPage - 1) * itemsPerPage, shipPage * itemsPerPage)"
          class="hover:bg-white/10 transition border-b border-white/10"
        >
          <td class="px-4 py-3 font-medium">{{ ship.name }}</td>
          <td class="px-4 py-3">{{ ship.brand?.name }}</td>
          <td class="px-4 py-3">
            <img
              *ngIf="ship.imageUrl"
              [src]="ship.imageUrl"
              class="w-32 h-16 rounded-md border border-white/20 object-cover shadow-md"
            />
          </td>
          <td class="px-4 py-3 text-right space-x-3">
            <button
              (click)="editShip(ship)"
              class="text-blue-400 hover:text-blue-300 transition font-medium"
            >
              ✏️ Éditer
            </button>
            <button
              (click)="deleteShip(ship.id, ship.name)"
              class="text-red-400 hover:text-red-300 transition font-medium"
            >
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center items-center mt-6 space-x-4 text-gray-300">
      <button
        (click)="prevShipPage()"
        [disabled]="currentShipPage === 1"
        class="px-4 py-1.5 bg-white/10 border border-white/20 rounded-md hover:bg-white/20 transition disabled:opacity-40"
      >
        ◀ Précédent
      </button>
      <span>Page {{ currentShipPage }} / {{ totalShipPages }}</span>
      <button
        (click)="nextShipPage()"
        [disabled]="currentShipPage === totalShipPages"
        class="px-4 py-1.5 bg-white/10 border border-white/20 rounded-md hover:bg-white/20 transition disabled:opacity-40"
      >
        Suivant ▶
      </button>
    </div>
  </section>

  <!-- ===================== MARQUES ===================== -->
  <section class="space-y-8">
    <div class="flex items-center justify-between">
      <h2 class="text-3xl font-semibold text-cyan-300">🏷️ Marques</h2>
    </div>

    <!-- Formulaire d’ajout -->
    <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-6 shadow-2xl space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <input
          [(ngModel)]="newBrand.name"
          placeholder="Nom de la marque"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />

        <input
          [(ngModel)]="newBrand.imageUrl"
          placeholder="URL de l’image"
          class="w-full px-4 py-2 rounded-lg bg-white/10 border border-white/20 text-white placeholder-gray-400
                 focus:outline-none focus:ring-2 focus:ring-cyan-400 transition"
        />
      </div>

      <div class="flex justify-end">
        <button
          (click)="createOrUpdateBrand()"
          [disabled]="isSubmittingBrand"
          class="bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
                 text-white font-semibold px-5 py-2 rounded-xl shadow-lg transition transform hover:scale-105
                 disabled:opacity-50"
        >
          {{ editingBrand ? 'Mettre à jour' : '+ Ajouter une marque' }}
        </button>
      </div>
    </div>

    <!-- Tableau des marques -->
    <div class="overflow-hidden rounded-2xl bg-white/10 backdrop-blur-xl border border-white/20 shadow-xl">
      <table class="min-w-full text-sm text-gray-200">
        <thead class="bg-white/10 text-cyan-300 uppercase tracking-wider border-b border-white/10">
        <tr>
          <th class="px-4 py-3 text-left">Nom</th>
          <th class="px-4 py-3 text-left">Image</th>
          <th class="px-4 py-3 text-right">Actions</th>
        </tr>
        </thead>

        <tbody>
        <tr
          *ngFor="let brand of paginatedBrands.slice((brandPage - 1) * itemsPerPage, brandPage * itemsPerPage)"
          class="hover:bg-white/10 transition border-b border-white/10"
        >
          <td class="px-4 py-3 font-medium">{{ brand.name }}</td>
          <td class="px-4 py-3">
            <img
              *ngIf="brand.imageUrl"
              [src]="brand.imageUrl"
              class="w-32 h-16 rounded-md border border-white/20 object-cover shadow-md"
            />
          </td>
          <td class="px-4 py-3 text-right space-x-3">
            <button
              (click)="editBrand(brand)"
              class="text-blue-400 hover:text-blue-300 transition font-medium"
            >
              ✏️ Éditer
            </button>
            <button
              (click)="deleteBrand(brand.name)"
              class="text-red-400 hover:text-red-300 transition font-medium"
            >
              🗑️ Supprimer
            </button>
          </td>
        </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex justify-center items-center mt-6 space-x-4 text-gray-300">
      <button
        (click)="prevBrandPage()"
        [disabled]="currentBrandPage === 1"
        class="px-4 py-1.5 bg-white/10 border border-white/20 rounded-md hover:bg-white/20 transition disabled:opacity-40"
      >
        ◀ Précédent
      </button>
      <span>Page {{ currentBrandPage }} / {{ totalBrandPages }}</span>
      <button
        (click)="nextBrandPage()"
        [disabled]="currentBrandPage === totalBrandPages"
        class="px-4 py-1.5 bg-white/10 border border-white/20 rounded-md hover:bg-white/20 transition disabled:opacity-40"
      >
        Suivant ▶
      </button>
    </div>
  </section>
</div>

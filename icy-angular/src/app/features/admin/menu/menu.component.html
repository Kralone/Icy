<!-- ================== MENU - STYLE ICY ================== -->
<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] p-10 text-white">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 max-w-7xl mx-auto">
    <div
      *ngFor="let item of menuItems"
      [routerLink]="[item.route]"
      class="group relative flex flex-col h-80 rounded-2xl border border-white/20 bg-white/10 backdrop-blur-xl
             shadow-lg transform transition duration-300 hover:scale-105 hover:border-cyan-400 hover:shadow-cyan-500/20
             cursor-pointer overflow-hidden"
    >
      <!-- Image -->
      <div class="relative h-3/4 w-full overflow-hidden">
        <img
          [src]="item.imageUrl"
          alt="{{ item.label }}"
          class="w-full h-full object-cover opacity-90 group-hover:opacity-100 transition duration-500"
        />

        <!-- Overlay lumineux -->
        <div
          class="absolute inset-0 bg-gradient-to-t from-[#0d1b2a]/90 via-transparent opacity-0 group-hover:opacity-100
                 transition-opacity duration-500"
        ></div>
      </div>

      <!-- Label -->
      <div
        class="h-1/4 flex items-center justify-center text-xl font-semibold
               text-white tracking-wide bg-[#0d1b2a]/70 backdrop-blur-md border-t border-white/10
               transition duration-300 group-hover:bg-[#1b263b]/70"
      >
        <span class="drop-shadow-[0_0_6px_rgba(56,189,248,0.6)]">
          {{ item.label }}
        </span>
      </div>

      <!-- Halo cyan -->
      <div
        class="absolute inset-0 rounded-2xl opacity-0 group-hover:opacity-100 transition duration-700
               bg-cyan-400/10 blur-2xl"
      ></div>
    </div>
  </div>
</div>

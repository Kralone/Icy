<!-- ================== MENU - STYLE ICY ================== -->
<div
  class="admin-menu loading-reveal min-h-screen w-full bg-gradient-to-b from-[#0a111c] via-[#0f172a] to-[#111827] text-white px-6 py-12"
  [attr.data-loading]="isLoading"
  >
  <app-loading-overlay
    [isLoading]="isLoading"
    [minDurationMs]="0"
    [fadeOutMs]="500"
    [softFade]="true"
  ></app-loading-overlay>
  <div class="admin-rank-orbit" aria-hidden="true">
    <app-rank-orbit [rank]="activeRankKey" [animateWhole]="true"></app-rank-orbit>
  </div>
  <div class="admin-rank-label">
    {{ activeRankLabel }}
  </div>
  <div class="admin-content max-w-7xl mx-auto space-y-8">
    <div class="flex flex-col gap-2 text-center">
      <h1 class="text-3xl sm:text-4xl font-semibold tracking-[0.2em] uppercase text-cyan-200">Admin Hub</h1>
      <p class="text-sm text-slate-400">Acces rapide a toutes les sections de gestion.</p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      @for (item of visibleMenuItems; track item; let i = $index) {
        <div
          class="admin-menu-card-wrap"
          [class.admin-menu-card-wrap--submenu]="item.route === '/icy/admin/data'"
          >
          @if (item.route === '/icy/admin/data') {
            <div class="admin-submenu-sheet admin-submenu-sheet--2" aria-hidden="true"></div>
          }
          @if (item.route === '/icy/admin/data') {
            <div class="admin-submenu-sheet admin-submenu-sheet--1" aria-hidden="true"></div>
          }
          <div
            [routerLink]="[item.route]"
          class="admin-menu-card group relative flex flex-col rounded-2xl border border-white/10 bg-white/5
                 shadow-[0_20px_50px_rgba(0,0,0,0.35)] transition duration-300
                 hover:-translate-y-1 hover:border-cyan-400/40 hover:shadow-[0_28px_60px_rgba(0,255,255,0.18)]
                 cursor-pointer overflow-hidden"
            [class.admin-menu-card--visible]="cardsVisible"
            [style.--card-delay.ms]="i * 45"
            >
            <div class="relative h-48 w-full overflow-hidden">
              <img
                [src]="item.imageUrl"
                alt="{{ item.label }}"
                class="w-full h-full object-cover opacity-85 group-hover:opacity-100 transition duration-500"
                />
                <div class="absolute inset-0 bg-gradient-to-t from-[#0b1324] via-transparent to-transparent"></div>
              </div>
              <div class="flex items-center justify-between px-5 py-4 bg-[#0b1324]/80 border-t border-white/10">
                <span class="text-sm uppercase tracking-[0.25em] text-slate-300">Section</span>
                <span class="text-lg font-semibold text-white">{{ item.label }}</span>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>

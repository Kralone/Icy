<!-- ================== ADMIN IMAGE LIBRARY - STYLE ICY ================== -->
<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white p-8 space-y-10">

  <!-- HEADER -->
  <div class="flex items-center justify-between">
    <a
      routerLink="/icy/admin"
      class="text-slate-300 hover:text-white inline-flex items-center gap-2 transition"
    >
      <span class="text-lg">←</span> Retour au tableau de bord
    </a>

    <label
      class="cursor-pointer bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500
             text-white font-semibold px-5 py-2 rounded-xl shadow-lg transition transform hover:scale-105 inline-flex items-center gap-2"
    >
      ⬆️ Uploader une image
      <input type="file" class="hidden" (change)="onFilePick($event)" accept="image/*" />
    </label>
  </div>

  <!-- ========================== SECTION BIBLIOTHÈQUE ========================== -->
  <section class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 shadow-xl p-6 space-y-6">
    <h1 class="text-2xl font-bold text-cyan-300">📸 Bibliothèque d’images</h1>

    <!-- Barre de recherche -->
    <div class="flex items-center gap-3">
      <input
        type="text"
        [(ngModel)]="query"
        placeholder="🔍 Rechercher une image (nom, tag, description)..."
        class="w-full px-4 py-2 bg-white/10 border border-white/20 rounded-xl text-white placeholder-gray-400
               focus:ring-2 focus:ring-cyan-400 outline-none"
      />
    </div>

    <!-- Dropzone -->
    <div
      (drop)="onDrop($event)"
      (dragover)="onDragOver($event)"
      class="border-2 border-dashed border-white/30 rounded-2xl p-6 text-center text-slate-300 bg-white/5 hover:bg-white/10 transition"
    >
      Glisse-dépose une image ici pour l’uploader
    </div>

    <!-- Loader -->
    <div *ngIf="isLoading" class="text-center text-gray-300 py-6">
      <span class="animate-pulse">Chargement des images...</span>
    </div>

    <!-- Empty -->
    <div *ngIf="!isLoading && filtered.length === 0" class="text-center italic text-gray-400 py-6">
      Aucune image trouvée.
    </div>

    <!-- Grille d’images -->
    <div *ngIf="!isLoading && filtered.length > 0"
         class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
      <div *ngFor="let img of filtered"
           class="bg-white/10 backdrop-blur-xl rounded-2xl border border-white/20 shadow-xl overflow-hidden group transition hover:scale-[1.02]">
        <div class="aspect-video bg-black/30 overflow-hidden">
          <img [src]="urlOf(img)" [alt]="img.name" class="w-full h-full object-cover group-hover:scale-105 transition" />
        </div>
        <div class="p-4 space-y-2">
          <div class="flex items-start justify-between gap-3">
            <div>
              <h3 class="text-white font-semibold truncate max-w-[220px]" [title]="img.name">{{ img.name }}</h3>
              <p class="text-slate-400 text-xs">{{ img.size | number }} octets • {{ img.uploadedAt | date:'medium' }}</p>
            </div>
            <button (click)="delete(img)"
                    class="text-red-300 hover:text-red-200 bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 rounded-lg px-2 py-1 text-xs transition">
              🗑
            </button>
          </div>

          <div class="flex items-center justify-between">
            <a [href]="urlOf(img)" target="_blank"
               class="text-cyan-300 hover:text-cyan-200 text-sm underline underline-offset-4">Ouvrir</a>

            <!-- ✅ Bouton copier -->
            <button (click)="copyLink(img)"
                    class="text-xs text-cyan-200 hover:text-white bg-cyan-500/10 hover:bg-cyan-500/20
                           border border-cyan-500/30 rounded-lg px-2 py-1 transition">
              📋 Copier le lien
            </button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ✅ Toast visuel -->
  <div *ngIf="toastMessage"
       class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-white/10 text-cyan-200 border border-white/20
              backdrop-blur-xl px-6 py-3 rounded-xl shadow-lg animate-fade-in-out">
    {{ toastMessage }}
  </div>
</div>

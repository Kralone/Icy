<div class="min-h-screen w-full bg-gradient-to-b from-[#0a111c] via-[#0f172a] to-[#111827] text-white px-6 py-10">
  <div class="max-w-6xl mx-auto space-y-8">
    <section class="rounded-2xl border border-white/10 bg-white/5 shadow-[0_25px_60px_rgba(0,0,0,0.35)] p-6">
      <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
          <p class="text-xs uppercase tracking-[0.28em] text-slate-400">Cartographie</p>
          <h1 class="text-3xl font-semibold text-cyan-200">Maps des zones contestees</h1>
        </div>
        <a
          [routerLink]="[backToStatusLink]"
          class="inline-flex items-center gap-2 px-6 py-3 rounded-full border border-cyan-200/85
                 bg-cyan-300/25 text-cyan-50 font-bold tracking-wide
                 shadow-[0_0_30px_rgba(34,211,238,0.45)] hover:bg-cyan-200/35 hover:scale-[1.03]
                 transition"
          >
          ← Retour au statut
        </a>
      </div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      @for (map of maps; track map) {
        <article
          class="rounded-2xl border border-white/10 bg-[#0b1324]/65 overflow-hidden shadow-[0_20px_50px_rgba(0,0,0,0.4)]"
          >
          <button
            type="button"
            class="w-full h-[320px] bg-[#050b17] block hover:brightness-110 transition cursor-zoom-in"
            (click)="openMap(map)"
            >
            <img [src]="map.imageUrl" [alt]="map.title + ' map'" class="w-full h-full object-contain" loading="lazy" />
          </button>
          <div class="px-4 py-3 border-t border-white/10">
            <h2 class="text-sm uppercase tracking-[0.2em] text-cyan-200">{{ map.title }}</h2>
          </div>
        </article>
      }
    </section>
  </div>
</div>

@if (selectedMap) {
  <div
    class="map-modal fixed inset-0 z-[70] bg-black/85 backdrop-blur-sm p-4 flex items-center justify-center"
    [class.map-modal--closing]="isClosingModal"
    (click)="closeMap()"
    >
    <div
      class="map-modal-panel relative w-full max-w-6xl max-h-[92vh] rounded-2xl border border-white/20 bg-[#050b17] overflow-hidden shadow-[0_30px_80px_rgba(0,0,0,0.6)]"
      [class.map-modal-panel--closing]="isClosingModal"
      role="dialog" aria-modal="true" [attr.aria-label]="selectedMap.title" cdkTrapFocus [cdkTrapFocusAutoCapture]="true" (keydown.escape)="closeMap(); $event.stopPropagation()" (click)="$event.stopPropagation()"
      >
      <header class="map-toolbar">
        <h2>{{ selectedMap.title }}</h2>
        <button type="button" (click)="setZoom(zoom / 1.25)" [disabled]="zoom <= 1" aria-label="Dézoomer">−</button>
        <output aria-live="polite">{{ (zoom * 100).toFixed(0) }} %</output>
        <button type="button" (click)="setZoom(zoom * 1.25)" [disabled]="zoom >= 6" aria-label="Zoomer">+</button>
        <button type="button" (click)="setZoom(1)">Ajuster</button>
        <button type="button" cdkFocusInitial (click)="closeMap()">Fermer</button>
      </header>
      <div class="map-viewport" tabindex="0" aria-label="Plan : utiliser les flèches pour déplacer la vue" (keydown)="keyboardPan($event)" (wheel)="wheel($event)"
        (pointerdown)="pointerDown($event)" (pointermove)="pointerMove($event)"
        (pointerup)="pointerUp($event)" (pointercancel)="pointerUp($event)" (lostpointercapture)="pointerUp($event)">
        <div class="map-canvas" [style.width.%]="zoom * 100" [style.height.%]="zoom * 100">
          <img [src]="selectedMap.imageUrl" [alt]="selectedMap.title" draggable="false" />
        </div>
      </div>
      </div>
    </div>
  }

<div class="relative w-full">
  <!-- Ligne de connexion verticale -->
  <div class="absolute top-0 left-3 bottom-0 w-px bg-gray-400 dark:bg-white" *ngIf="goal.subGoals?.length"></div>

  <!-- Contenu principal en ligne -->
  <div class="pl-6 w-full" [ngClass]="{ 'mt-5': goal.parentId === null, 'mt-2': goal.parentId !== null }">
    <div class="flex flex-wrap items-center justify-between gap-4 bg-white dark:bg-gray-800 rounded-lg shadow-md p-1.5 border border-gray-300 dark:border-gray-700">

      <!-- Titre + description -->
      <div class="flex items-center gap-2 flex-wrap min-w-[200px] pl-1 pr-1">
        <!-- DOUBLE CHEVRON TOGGLE -->
        <button *ngIf="goal.subGoals?.length && depth >= 1"
                (click)="toggleChildrenVisibility()"
                class="p-1 focus:outline-none">
          <svg [class.rotate-90]="showChildren"
               class="w-5 h-5 text-gray-400 dark:text-gray-300 transform transition-transform duration-300"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <!-- Deux chevrons côte à côte -->
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 7l5 5-5 5 M12 7l5 5-5 5" />
          </svg>
        </button>

        <!-- TITRE + DESCRIPTION -->
        <h3 class="text-base font-semibold text-gray-800 dark:text-white whitespace-nowrap">
          {{ goal.name }}
        </h3>
        <span class="text-sm text-gray-500 dark:text-gray-400 italic whitespace-nowrap">
    — {{ goal.description }}
  </span>
      </div>


      <!-- Barre de progression -->
      <div class="flex items-center gap-2 min-w-[200px] grow">
        <div class="w-full bg-gray-300 h-2 rounded dark:bg-gray-700">
          <div
            class="h-2 rounded"
            [ngClass]="{
              'bg-green-500': calculateProgress(goal) === 100,
              'bg-blue-500': calculateProgress(goal) < 100
            }"
            [style.width.%]="calculateProgress(goal)">
          </div>
        </div>
        <div class="text-xs text-gray-500 dark:text-gray-400 whitespace-nowrap">
          {{ goal.current }} / {{ goal.target }} ({{ calculateProgress(goal) | number:'1.0-0' }}%)
        </div>
      </div>

      <!-- Actions +1 / -1 -->
      <div class="flex items-center gap-2">
        <button
          (click)="increment(goal.id, -1)"
          [disabled]="goal.current <= 0 || loading"
          class="px-2 py-1 rounded bg-gray-300 dark:bg-gray-600 text-gray-900 dark:text-white disabled:opacity-50 disabled:cursor-not-allowed transition"
        >-1</button>
        <button
          (click)="increment(goal.id, 1)"
          [disabled]="goal.current >= goal.target || loading"
          class="px-2 py-1 rounded bg-gray-300 dark:bg-gray-600 text-gray-900 dark:text-white disabled:opacity-50 disabled:cursor-not-allowed transition"
        >+1</button>
      </div>

      <!-- Admin buttons -->
      <div *ngIf="isAdmin" class="flex items-center gap-2">
        <button
          *ngIf="goal.parentId === null"
          (click)="togglePinned()"
          [disabled]="goal.pinned"
          [ngClass]="{
            'bg-green-100 text-green-900 dark:bg-green-700 dark:text-white cursor-not-allowed': goal.pinned,
            'bg-yellow-100 hover:bg-yellow-200 dark:bg-yellow-700 dark:hover:bg-yellow-600 text-yellow-800 dark:text-white cursor-pointer': !goal.pinned
          }"
          class="px-3 py-1 rounded shadow-sm text-sm font-medium transition"
        >📌</button>
        <button
          (click)="deleteGoal()"
          class="bg-red-100 hover:bg-red-200 dark:bg-red-700 dark:hover:bg-red-600 text-red-800 dark:text-white px-3 py-1 rounded shadow-sm text-sm font-medium transition"
        >🗑️</button>
      </div>

    </div>
  </div>

  <!-- Sous-objectifs récursifs -->
  <div class="pl-8">
    <!-- Conteneur animé -->
    <div class="transition-all duration-500 ease-in-out overflow-hidden"
         [style.maxHeight]="showChildren ? '1000px' : '0px'"
         [style.opacity]="showChildren ? '1' : '0'">
      <ng-container *ngFor="let sub of goal.subGoals">
        <app-goal-sub [goal]="sub" [isAdmin]="isAdmin" [depth]="depth + 1" (refresh)="refresh.emit()">
        </app-goal-sub>
      </ng-container>
    </div>
  </div>
</div>

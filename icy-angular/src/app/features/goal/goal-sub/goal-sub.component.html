<div class="relative w-full">

  <!-- Ligne verticale -->
  <div class="absolute top-0 left-3 bottom-0 w-px bg-white/20" *ngIf="goal.subGoals?.length"></div>

  <!-- Bloc principal -->
  <div class="pl-6 w-full" [ngClass]="{ 'mt-6': goal.parentId === null, 'mt-3': goal.parentId !== null }">
    <div
      class="flex flex-wrap items-center justify-between gap-4 bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl shadow-lg p-2.5 transition hover:shadow-cyan-500/10">

      <!-- Titre + description -->
      <div class="flex items-center gap-2 flex-wrap min-w-[200px] pl-1 pr-1">
        <!-- Double chevron -->
        <button *ngIf="goal.subGoals?.length && depth >= 1"
                (click)="toggleChildrenVisibility()"
                class="p-1 focus:outline-none text-cyan-300 hover:text-cyan-100 transition">
          <svg [class.rotate-90]="showChildren"
               class="w-5 h-5 transform transition-transform duration-300"
               xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 7l5 5-5 5 M12 7l5 5-5 5" />
          </svg>
        </button>

        <h3 class="text-base font-semibold text-white whitespace-nowrap">
          {{ goal.name }}
        </h3>
        <span class="text-sm text-gray-300 italic whitespace-nowrap">
          — {{ goal.description }}
        </span>
      </div>

      <!-- Barre de progression (fix CSS définitif) -->
      <div class="flex items-center gap-3 min-w-[220px] grow">
        <div
          class="relative w-full h-2 rounded-md border border-white/10"
          [ngStyle]="{
      'background-image': calculateProgress(goal) >= 100
        ? 'linear-gradient(to right, #22d3ee, #22c55e)'
        : 'linear-gradient(to right, #06b6d4, #2563eb)',
      'background-size': calculateProgress(goal) + '% 100%',
      'background-repeat': 'no-repeat',
      'background-color': 'rgba(255,255,255,0.1)',
      'transition': 'background-size 0.5s ease-out'
    }"
        >
          <!-- Halo -->
          <div class="absolute inset-0 rounded-md bg-gradient-to-r from-cyan-400/10 via-transparent to-cyan-400/10 blur-[2px] pointer-events-none"></div>
        </div>

        <div class="text-xs text-gray-300 whitespace-nowrap">
          {{ goal.current }} / {{ goal.target }} ({{ calculateProgress(goal) | number:'1.0-0' }}%)
        </div>
      </div>



      <!-- Boutons +1 / -1 -->
      <div class="flex items-center gap-2">
        <button
          (click)="increment(goal.id, -1)"
          [disabled]="goal.current <= 0 || loading"
          class="px-2 py-1 rounded-md border border-white/20 bg-white/10 text-white hover:bg-white/20 disabled:opacity-50 transition">
          -1
        </button>
        <button
          (click)="increment(goal.id, 1)"
          [disabled]="goal.current >= goal.target || loading"
          class="px-2 py-1 rounded-md border border-cyan-400/40 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-200 disabled:opacity-50 transition">
          +1
        </button>
      </div>

      <!-- Boutons admin -->
      <div *ngIf="isAdmin" class="flex items-center gap-2">
        <button
          *ngIf="goal.parentId === null"
          (click)="togglePinned()"
          [disabled]="goal.pinned"
          [ngClass]="{
            'bg-green-500/20 text-green-300 border-green-400/40 cursor-not-allowed': goal.pinned,
            'bg-yellow-500/20 text-yellow-200 hover:bg-yellow-400/30 border-yellow-400/40 cursor-pointer': !goal.pinned
          }"
          class="px-3 py-1 rounded-md border text-sm font-medium transition">
          📌
        </button>
        <button
          (click)="deleteGoal()"
          class="bg-red-500/10 hover:bg-red-500/20 text-red-300 border border-red-400/40 px-3 py-1 rounded-md text-sm font-medium transition">
          🗑️
        </button>
      </div>
    </div>
  </div>

  <!-- Sous-objectifs récursifs -->
  <div class="pl-8">
    <div class="transition-all duration-500 ease-in-out overflow-hidden"
         [class.max-h-0]="!showChildren"
         [class.max-h-[9999px]]="showChildren"
         [class.opacity-0]="!showChildren"
         [class.opacity-100]="showChildren">
      <ng-container *ngFor="let sub of sortedSubGoals">
        <app-goal-sub
          [goal]="sub"
          [isAdmin]="isAdmin"
          [depth]="depth + 1"
          [showChildren]="false"
          (refresh)="refresh.emit()">
        </app-goal-sub>
      </ng-container>
    </div>
  </div>
</div>

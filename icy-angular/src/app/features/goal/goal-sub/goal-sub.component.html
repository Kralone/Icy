<div class="relative w-full">
  <!-- Fil d’arbre vertical -->
  <div class="absolute top-0 left-3 bottom-0 w-px bg-gray-400 dark:bg-white" *ngIf="goal.subGoals?.length"></div>

  <!-- Carte de l’objectif -->
  <div class="pl-6 w-full" [ngClass]="{ 'mt-5': goal.parentId === null, 'mt-2': goal.parentId !== null }">
    <div class="w-full bg-white dark:bg-gray-800 rounded-lg shadow-md p-4 border border-gray-300 dark:border-gray-700">

      <!-- Titre + Description + Actions admin -->
      <div class="flex justify-between items-start flex-wrap gap-2">
        <!-- Titre + description -->
        <div class="flex items-center gap-2 flex-wrap">
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white">{{ goal.name }}</h3>
          <span class="text-sm text-gray-500 dark:text-gray-400 italic">— {{ goal.description }}</span>
        </div>

        <!-- Admin buttons -->
        <div *ngIf="isAdmin" class="flex gap-2 mt-1">
          <!-- Pinned only for root -->
          <button
            *ngIf="goal.parentId === null"
            (click)="togglePinned()"
            [disabled]="goal.pinned"
            [ngClass]="{
              'bg-green-100 text-green-900 dark:bg-green-700 dark:text-white cursor-not-allowed': goal.pinned,
              'bg-yellow-100 hover:bg-yellow-200 dark:bg-yellow-700 dark:hover:bg-yellow-600 text-yellow-800 dark:text-white cursor-pointer': !goal.pinned
            }"
            class="flex items-center gap-1 px-3 py-1 rounded shadow-sm text-sm font-medium transition"
          >
            📌 Épingler
          </button>

          <!-- Delete -->
          <button
            (click)="deleteGoal()"
            class="flex items-center gap-1 bg-red-100 hover:bg-red-200 dark:bg-red-700 dark:hover:bg-red-600 text-red-800 dark:text-white px-3 py-1 rounded shadow-sm text-sm font-medium cursor-pointer transition"
          >
            🗑️ Supprimer
          </button>
        </div>
      </div>

      <!-- Barre de progression + % + boutons -->
      <div class="mt-3 grid grid-cols-[1fr_auto_auto_auto] items-center gap-3">
        <!-- Barre -->
        <div>
          <div class="w-full bg-gray-300 h-2 rounded dark:bg-gray-700">
            <div
              class="h-2 rounded"
              [ngClass]="{
                'bg-green-500': calculateProgress(goal) === 100,
                'bg-blue-500': calculateProgress(goal) < 100
              }"
              [style.width.%]="calculateProgress(goal)">
            </div>
          </div>
          <div class="text-xs text-gray-500 dark:text-gray-400 mt-1">
            {{ goal.current }} / {{ goal.target }}
          </div>
        </div>

        <!-- % -->
        <div class="text-sm font-semibold text-gray-800 dark:text-white w-12 text-right">
          {{ calculateProgress(goal) | number:'1.0-0' }}%
        </div>

        <div class="flex items-center gap-2 mt-2">
          <!-- Bouton -1 -->
          <button
            (click)="increment(goal.id, -1)"
            [disabled]="goal.current <= 0 || loading"
            class="px-2 py-1 rounded bg-gray-300 dark:bg-gray-600 text-gray-900 dark:text-white disabled:opacity-50 disabled:cursor-not-allowed transition"
          >
            -1
          </button>

          <!-- Affichage -->
          <span class="text-sm text-gray-700 dark:text-gray-200">
    {{ goal.current }} / {{ goal.target }}
  </span>

          <!-- Bouton +1 -->
          <button
            (click)="increment(goal.id, 1)"
            [disabled]="goal.current >= goal.target || loading"
            class="px-2 py-1 rounded bg-gray-300 dark:bg-gray-600 text-gray-900 dark:text-white disabled:opacity-50 disabled:cursor-not-allowed transition"
          >
            +1
          </button>
        </div>

      </div>
    </div>
  </div>

  <!-- Sous-objectifs récursifs -->
  <div class="pl-8">
    <ng-container *ngFor="let sub of goal.subGoals">
      <app-goal-sub [goal]="sub" [isAdmin]="isAdmin" (refresh)="refresh.emit()"></app-goal-sub>
    </ng-container>
  </div>
</div>

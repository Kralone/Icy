<div class="relative w-full">
  <!-- Ligne verticale -->
  <div
    class="absolute top-0 left-3 bottom-0 w-px bg-white/20"
    *ngIf="goal.subGoals?.length"
  ></div>

  <!-- Bloc principal -->
  <div
    class="pl-4 sm:pl-6 w-full"
    [ngClass]="{
      'mt-6': goal.parentId === null,
      'mt-3': goal.parentId !== null
    }"
  >
    <div
      class="flex flex-col gap-3 bg-white/10 backdrop-blur-2xl border border-white/20 rounded-2xl shadow-[0_0_25px_rgba(56,189,248,0.15)] p-4 sm:p-3 transition hover:shadow-cyan-500/10"
    >

      <!-- Titre + Description -->
      <div class="flex items-start justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 flex-wrap text-sm sm:text-base">
          <button
            *ngIf="goal.subGoals?.length && depth >= 1"
            (click)="toggleChildrenVisibility()"
            class="p-1 focus:outline-none text-cyan-300 hover:text-cyan-100 transition"
          >
            <svg
              [class.rotate-90]="showChildren"
              class="w-4 h-4 transform transition-transform duration-300"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 7l5 5-5 5 M12 7l5 5-5 5"
              />
            </svg>
          </button>

          <h3 class="font-semibold text-white truncate max-w-[180px]">
            {{ goal.name }}
          </h3>
        </div>

        <span
          class="text-xs sm:text-sm text-gray-300 italic w-full sm:w-auto"
        >
          {{ goal.description }}
        </span>
      </div>

      <!-- Barre de progression -->
      <div class="w-full">
        <div
          class="relative w-full h-2 rounded-md border border-white/10 overflow-hidden"
        >
          <div
            class="absolute inset-0 rounded-md transition-all duration-500 ease-out"
            [ngStyle]="{
              'background-image': calculateProgress(goal) >= 100
                ? 'linear-gradient(to right, #22d3ee, #22c55e)'
                : 'linear-gradient(to right, #06b6d4, #2563eb)',
              'background-size': calculateProgress(goal) + '% 100%',
              'background-repeat': 'no-repeat',
              'background-color': 'rgba(255,255,255,0.1)'
            }"
          ></div>
        </div>

        <div
          class="text-xs text-gray-300 mt-1 text-right"
        >
          {{ goal.current }} / {{ goal.target }}
          ({{ calculateProgress(goal) | number:'1.0-0' }}%)
        </div>
      </div>

      <!-- Actions -->
      <div
        class="flex flex-wrap justify-between items-center gap-3 mt-2 sm:mt-0"
      >
        <!-- Boutons +1 / -1 -->
        <div class="flex gap-2">
          <button
            (click)="increment(goal.id, -1)"
            [disabled]="goal.current <= 0 || loading"
            class="px-3 py-1 rounded-md border border-white/20 bg-white/10 text-white hover:bg-white/20 disabled:opacity-50 transition"
          >
            -1
          </button>
          <button
            (click)="increment(goal.id, 1)"
            [disabled]="goal.current >= goal.target || loading"
            class="px-3 py-1 rounded-md border border-cyan-400/40 bg-cyan-500/10 hover:bg-cyan-500/20 text-cyan-200 disabled:opacity-50 transition"
          >
            +1
          </button>
        </div>

        <!-- Boutons admin -->
        <div
          *ngIf="isAdmin"
          class="flex gap-2"
        >
          <button
            *ngIf="goal.parentId === null"
            (click)="togglePinned()"
            [disabled]="goal.pinned"
            [ngClass]="{
              'bg-green-500/20 text-green-300 border-green-400/40 cursor-not-allowed': goal.pinned,
              'bg-yellow-500/20 text-yellow-200 hover:bg-yellow-400/30 border-yellow-400/40 cursor-pointer': !goal.pinned
            }"
            class="px-3 py-1 rounded-md border text-sm font-medium transition"
          >
            📌
          </button>
          <button
            (click)="deleteGoal()"
            class="bg-red-500/10 hover:bg-red-500/20 text-red-300 border border-red-400/40 px-3 py-1 rounded-md text-sm font-medium transition"
          >
            🗑️
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Sous-objectifs -->
  <div class="pl-6 sm:pl-8">
    <div
      class="transition-all duration-500 ease-in-out overflow-hidden"
      [class.max-h-0]="!showChildren"
      [class.max-h-[9999px]]="showChildren"
      [class.opacity-0]="!showChildren"
      [class.opacity-100]="showChildren"
    >
      <ng-container *ngFor="let sub of sortedSubGoals">
        <app-goal-sub
          [goal]="sub"
          [isAdmin]="isAdmin"
          [depth]="depth + 1"
          [showChildren]="false"
          (refresh)="refresh.emit()"
        ></app-goal-sub>
      </ng-container>
    </div>
  </div>
</div>

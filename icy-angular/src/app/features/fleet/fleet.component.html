<!-- ================== FLOTTE - STYLE ICY sans ombre basse ================== -->
<div class="min-h-screen w-full bg-gradient-to-b from-[#0d1b2a] via-[#1b263b] to-[#415a77] text-white p-8">
  <h2 class="text-3xl font-bold mb-8 text-white drop-shadow-[0_0_10px_rgba(56,189,248,0.3)]">
    🛸 Résumé complet de la flotte
  </h2>

  <!-- Chargement -->
  <div *ngIf="isLoading" class="h-24 flex items-center justify-center">
    <app-loading-overlay [isLoading]="true"></app-loading-overlay>
  </div>

  <!-- Résumé -->
  <ng-container *ngIf="!isLoading && fleetSummary && objectKeys(fleetSummary).length > 0; else noFleet">

    <div *ngFor="let focus of objectKeys(fleetSummary)" class="space-y-4 mb-10">
      <!-- Titre de catégorie -->
      <h3 class="text-xl font-semibold uppercase tracking-wide text-cyan-300 border-b border-cyan-600/40 pb-2">
        {{ focus }}
        <span class="text-gray-400 text-sm">({{ fleetSummary[focus].length }})</span>
      </h3>

      <!-- Grille -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <div
          *ngFor="let ship of fleetSummary[focus]"
          class="group relative bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl overflow-hidden shadow-lg
                 transition-transform duration-300 transform hover:scale-105 hover:border-cyan-400"
        >
          <!-- Image -->
          <img
            *ngIf="ship.imageUrl"
            [src]="ship.imageUrl"
            alt="{{ ship.name }}"
            class="w-full h-44 object-cover opacity-90 group-hover:opacity-100 transition duration-300"
          />

          <!-- Overlay -->
          <div
            class="absolute inset-0 bg-gradient-to-t from-[#0d1b2a]/90 via-transparent opacity-0 group-hover:opacity-100
                   transition-opacity duration-300"
          ></div>

          <!-- Infos -->
          <div class="absolute bottom-0 w-full p-4 bg-[#0d1b2a]/70 backdrop-blur-md border-t border-white/10">
            <h4 class="font-semibold text-base truncate" [title]="ship.name">
              {{ ship.name }}
            </h4>
          </div>
        </div>
      </div>
    </div>

  </ng-container>

  <!-- Aucun vaisseau -->
  <ng-template #noFleet>
    <div class="flex flex-col items-center justify-center h-96 text-gray-400">
      <svg class="w-14 h-14 mb-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <p class="text-lg italic">Aucun vaisseau dans la flotte.</p>
    </div>
  </ng-template>
</div>

<div class="p-6 space-y-6 min-h-[80vh]">
  <h2 class="text-3xl font-bold text-gray-800 dark:text-white">🛸 Résumé complet de la flotte</h2>

  <!-- Chargement -->
  <div *ngIf="isLoading" class="h-24 flex items-center justify-center">
    <app-loading-overlay [isLoading]="true"></app-loading-overlay>
  </div>

  <!-- Résumé de flotte -->
  <ng-container *ngIf="!isLoading && fleetSummary && objectKeys(fleetSummary).length > 0; else noFleet">
    <div *ngFor="let focus of objectKeys(fleetSummary)" class="space-y-4">
      <h3 class="text-xl font-semibold text-blue-700 dark:text-blue-300 uppercase border-b border-blue-300 pb-1">
        {{ focus }} ({{ fleetSummary[focus].length }})
      </h3>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div *ngFor="let ship of fleetSummary[focus]"
             class="relative rounded-lg overflow-hidden shadow-md hover:scale-105 transform transition duration-300">
          <img *ngIf="ship.imageUrl"
               [src]="ship.imageUrl"
               alt="{{ ship.name }}"
               class="w-full h-40 object-cover opacity-90" />
          <div class="p-4 bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-gray-100">
            <h4 class="font-bold text-lg truncate" [title]="ship.name">
              {{ ship.name }}
            </h4>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Aucun vaisseau -->
  <ng-template #noFleet>
    <p class="text-gray-500 dark:text-gray-400 text-lg text-center mt-10">
      Aucun vaisseau dans la flotte.
    </p>
  </ng-template>
</div>

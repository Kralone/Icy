<div class="route-shell" [class.route-shell--with-topbar]="showPublicTopbar">
  @if (showPublicTopbar) {
    <front-public-topbar></front-public-topbar>
  }
  <router-outlet></router-outlet>
</div>

<ng-template #updateToastTpl>
  <div class="flex items-center gap-5">

    <div class="flex items-center gap-2">
      <span class="text-lg">✨</span>
      <div class="flex flex-col text-left">
        <span class="font-bold text-sm text-white leading-none">Mise à jour</span>
        <span class="text-xs text-cyan-200/80 leading-tight">Nouvelle version disponible</span>
      </div>
    </div>

    <div class="h-4 w-px bg-white/20"></div>

    <button
      (click)="reloadPage(); $event.stopPropagation()"
      class="pointer-events-auto cursor-pointer bg-cyan-500 hover:bg-cyan-400 text-[#0d1b2a] text-xs font-extrabold py-2 px-4 rounded-full transition-transform active:scale-95 shadow-lg shadow-cyan-500/20 whitespace-nowrap"
      >
      RAFRAÎCHIR
    </button>

  </div>
</ng-template>

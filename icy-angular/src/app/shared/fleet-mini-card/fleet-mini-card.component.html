<div class="rounded-xl border border-white/10 bg-white/5 overflow-hidden shadow-[0_10px_24px_rgba(0,0,0,0.35)]">
  <div class="relative w-full" style="aspect-ratio: 4 / 3;">
    @if (ship?.imageUrl) {
      <img
        [src]="$safeNavigationMigration(ship?.imageUrl)"
        alt="{{ ship?.name }}"
        class="absolute inset-0 h-full w-full object-cover opacity-90"
        />
    }
    <div class="absolute inset-0 bg-gradient-to-t from-[#0b1324]/80 via-transparent"></div>
    @if (ship?.brandImageUrl) {
      <img
        [src]="$safeNavigationMigration(ship?.brandImageUrl)"
        alt="Logo marque"
        class="absolute top-1.5 right-1.5 w-8 h-8 object-contain rounded-full bg-white/60 p-1.5 shadow-md"
        />
    }
  </div>

  <div class="px-2 py-2">
    <div class="text-xs font-semibold text-white truncate" [title]="$safeNavigationMigration(ship?.name)">
      {{ ship?.name }}
    </div>
  </div>
</div>

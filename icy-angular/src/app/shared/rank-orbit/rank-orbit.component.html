<div class="orbit" aria-hidden="true">
  <!-- Calque arrière : halo, anneaux et satellites, puis le cœur lumineux (mode emblème). -->
  <svg class="orbit-layer" viewBox="-100 -100 200 200" focusable="false">
    <defs>
      @for (ring of rings(); track $index) {
        <linearGradient
          [attr.id]="uid + '-back-ring-' + $index"
          gradientUnits="userSpaceOnUse"
          x1="0"
          [attr.y1]="-ring.ry"
          x2="0"
          [attr.y2]="ring.ry"
        >
          <stop offset="0" class="tone-stop" [attr.stop-opacity]="ring.opacity * 0.3" />
          <stop offset="0.5" class="tone-stop" [attr.stop-opacity]="ring.opacity * 0.62" />
          <stop offset="1" class="tone-stop" [attr.stop-opacity]="ring.opacity" />
        </linearGradient>
      }
      <radialGradient [attr.id]="uid + '-halo'" r="0.5">
        <stop offset="0.4" class="tone-stop" stop-opacity="0.16" />
        <stop offset="1" class="tone-stop" stop-opacity="0" />
      </radialGradient>
      <radialGradient [attr.id]="uid + '-core'">
        <stop offset="0" stop-color="#fff" />
        <stop offset="0.3" stop-color="#fff" stop-opacity="0.95" />
        <stop offset="0.55" class="tone-stop" stop-opacity="0.85" />
        <stop offset="1" class="tone-stop" stop-opacity="0" />
      </radialGradient>
    </defs>
    <circle r="100" [attr.fill]="'url(#' + uid + '-halo)'" />
      <g [attr.transform]="'rotate(' + tilt + ')'">
        <g>
          @for (ring of rings(); track $index) {
            <ellipse
              #outline
              [attr.data-ring]="$index"
              [attr.rx]="ring.rx"
              [attr.ry]="ring.ry"
              fill="none"
              [attr.stroke]="'url(#' + uid + '-back-ring-' + $index + ')'"
              stroke-width="2"
            />
          }
          @for (ring of rings(); track $index) {
            <g #satellite [attr.data-ring]="$index" [attr.transform]="'translate(' + ring.rx + ' 0) scale(3.7)'">
              <circle r="2.4" class="tone-fill" fill-opacity="0.2" />
              <circle r="1" class="tone-fill" />
            </g>
          }
        </g>
      </g>
    @if (mode() === 'emblem') {
      <g [attr.transform]="'rotate(' + tilt + ')'">
        @for (wave of waves; track wave) {
          <ellipse #wave rx="16" ry="6.72" fill="none" class="tone-stroke" stroke-width="2.6" stroke-opacity="0" />
        }
      </g>
      <g #core>
        <circle r="30" [attr.fill]="'url(#' + uid + '-core)'" />
      </g>
    }
  </svg>

  @if (mode() === 'avatar') {
    <div class="orbit-center">
      <ng-content />
    </div>
  }

  <!-- Calque avant : visible seulement sur l'avatar ou le cœur, sur sa moitié basse, avec un fondu. -->
  <svg class="orbit-layer" viewBox="-100 -100 200 200" focusable="false">
    <defs>
      @for (ring of rings(); track $index) {
        <linearGradient
          [attr.id]="uid + '-front-ring-' + $index"
          gradientUnits="userSpaceOnUse"
          x1="0"
          [attr.y1]="-ring.ry"
          x2="0"
          [attr.y2]="ring.ry"
        >
          <stop offset="0" class="tone-stop" [attr.stop-opacity]="ring.opacity * 0.3" />
          <stop offset="0.5" class="tone-stop" [attr.stop-opacity]="ring.opacity * 0.62" />
          <stop offset="1" class="tone-stop" [attr.stop-opacity]="ring.opacity" />
        </linearGradient>
      }
      <linearGradient [attr.id]="uid + '-depth'" gradientUnits="userSpaceOnUse" x1="0" y1="-8" x2="0" y2="8">
        <stop offset="0" stop-color="#000" />
        <stop offset="1" stop-color="#fff" />
      </linearGradient>
      <mask [attr.id]="uid + '-mask'" maskUnits="userSpaceOnUse" x="-120" y="-120" width="240" height="240">
        <circle [attr.r]="mode() === 'avatar' ? avatarRadius + 1.5 : coreRadius" [attr.fill]="'url(#' + uid + '-depth)'" />
      </mask>
    </defs>
      <g [attr.transform]="'rotate(' + tilt + ')'">
        <g [attr.mask]="'url(#' + uid + '-mask)'">
          @for (ring of rings(); track $index) {
            <ellipse
              #outline
              [attr.data-ring]="$index"
              [attr.rx]="ring.rx"
              [attr.ry]="ring.ry"
              fill="none"
              [attr.stroke]="'url(#' + uid + '-front-ring-' + $index + ')'"
              stroke-width="2"
            />
          }
          @for (ring of rings(); track $index) {
            <g #satellite [attr.data-ring]="$index" [attr.transform]="'translate(' + ring.rx + ' 0) scale(3.7)'">
              <circle r="2.4" class="tone-fill" fill-opacity="0.2" />
              <circle r="1" class="tone-fill" />
            </g>
          }
        </g>
      </g>
  </svg>
</div>

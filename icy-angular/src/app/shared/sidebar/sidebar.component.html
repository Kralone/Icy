<aside class="sidebar bg-gray-900 border-l border-gray-700 p-5 shadow-xl" [class.collapsed]="isCollapsed">

  <!-- Sidebar header avec logo cliquable -->
  <div class="sidebar-header flex flex-col items-center justify-center mb-6 space-y-4">
    <a [routerLink]="['/icy/dashboard']" class="block">
      <img src="assets/images/home/iceforgeLogo.png"
           alt="IceForge Logo"
           class="h-20 w-20 object-contain transition-transform duration-300 hover:scale-105" />
    </a>

    <button class="burger-btn text-white text-2xl" (click)="toggleSidebar()">☰</button>
  </div>

  <!-- Navigation -->
  <nav>
    <ul class="space-y-2">
      <li *ngFor="let item of menuItems">
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          class="nav-item group flex items-center gap-4 px-4 py-2 text-gray-300 hover:bg-gray-800 rounded-md transition duration-300 ease-in-out"
        >
          <span class="text-xl">{{ item.icon }}</span>
          <span class="menu-text text-sm uppercase tracking-wide">{{ item.label }}</span>
        </a>
      </li>
      <li *ngIf="isAdminUser">
        <a
          [routerLink]="['/icy/admin']"
          routerLinkActive="active"
          class="nav-item group flex items-center gap-4 px-4 py-2 text-blue-400 hover:bg-gray-800 rounded-md transition"
        >
          <span class="text-xl">🛡️</span>
          <span class="menu-text text-sm uppercase tracking-wide">Admin</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Logout -->
  <button class="logout-btn flex items-center justify-center gap-2" (click)="logout()">
    🚪
    <span class="menu-text">Logout</span>
  </button>


</aside>

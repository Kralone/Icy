<aside class="sidebar bg-gradient-to-br from-blue-900 to-blue-600 backdrop-blur-lg border-l-4 border-cyan-400/60 p-5 shadow-2xl"
       [class.collapsed]="isCollapsed">

  <!-- 🏠 Logo + Menu Burger -->
  <div class="sidebar-header flex justify-between items-center mb-8">
    <span class="text-glow text-3xl font-extrabold tracking-widest">LOGO</span>
    <button class="burger-btn text-white text-3xl focus:outline-none"
            (click)="toggleSidebar()">
      ☰
    </button>
  </div>

  <!-- 📌 Menu -->
  <nav>
    <ul class="space-y-4">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.link"
           routerLinkActive="active"
           class="animated-border flex items-center gap-4 px-5 py-3 text-white text-lg font-semibold tracking-wide uppercase transition duration-300 border-transparent">
          <span class="text-cyan-400 icon-glow text-2xl">{{ item.icon }}</span>
          <span class="menu-text">{{ item.label }}</span>
        </a>
      </li>
    </ul>
  </nav>
  <!-- Bouton Logout toujours en bas -->
  <button class="logout-btn" (click)="logout()">
    🚪 Logout
  </button>

</aside>

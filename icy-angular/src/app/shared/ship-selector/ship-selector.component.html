<div
  *ngIf="isOpen"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-xl px-4"
  (click)="closeModal()"
>
  <div
    class="relative w-full max-w-2xl bg-[#0d1b2a]/90 text-white backdrop-blur-2xl border border-white/20
           rounded-2xl shadow-[0_0_25px_rgba(56,189,248,0.35)] p-6"
    (click)="$event.stopPropagation()"
  >
    <button (click)="closeModal()" class="absolute top-3 right-3 text-gray-300 hover:text-white">✖</button>

    <div class="relative w-full h-64 mb-6 rounded-xl overflow-hidden shadow-lg ring-1 ring-white/20">
      <img *ngIf="selectedShipImageUrl" [src]="selectedShipImageUrl" alt="Vaisseau" class="w-full h-full object-cover" />
      <div *ngIf="!selectedShipImageUrl" class="w-full h-full grid place-items-center bg-white/5 text-gray-400">
        Apercu du vaisseau
      </div>

      <img
        *ngIf="selectedBrandImageUrl"
        [src]="selectedBrandImageUrl"
        alt="Logo marque"
        class="absolute top-3 right-3 w-20 h-20 object-contain bg-white/20 rounded-full p-2 shadow-md"
      />
    </div>

    <div class="mb-4 flex flex-wrap items-center gap-3">
      <div class="relative flex items-center bg-white/10 border border-white/20 rounded-full p-1 shadow-sm overflow-hidden">
        <div
          class="absolute top-1 bottom-1 left-1 w-[calc(50%-0.25rem)] rounded-full bg-gradient-to-r from-cyan-500/40 to-blue-500/40
                 shadow-[0_0_12px_rgba(56,189,248,0.45)] transition-transform duration-200"
          [ngClass]="{ 'translate-x-full': useClassicAddMode }"
        ></div>
        <button
          type="button"
          (click)="setAddMode(false)"
          class="relative z-10 px-4 py-1.5 text-xs font-semibold rounded-full transition"
          [ngClass]="{ 'text-cyan-100': !useClassicAddMode, 'text-white/60': useClassicAddMode }"
        >
          🔎 Recherche
        </button>
        <button
          type="button"
          (click)="setAddMode(true)"
          class="relative z-10 px-4 py-1.5 text-xs font-semibold rounded-full transition"
          [ngClass]="{ 'text-cyan-100': useClassicAddMode, 'text-white/60': !useClassicAddMode }"
        >
          🏷️ Marque
        </button>
      </div>
    </div>

    <ng-container *ngIf="useClassicAddMode; else searchMode">
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1 text-cyan-200">Marque</label>
        <select
          [(ngModel)]="selectedBrand"
          (change)="onBrandChange()"
          class="w-full px-3 py-2 rounded-lg bg-[#1b263b]/70 border border-white/20 text-white focus:ring-2 focus:ring-cyan-400 outline-none"
        >
          <option *ngFor="let brand of brands" [value]="brand.name">{{ brand.name }}</option>
        </select>
      </div>

      <div *ngIf="filteredShipsModal.length > 0" class="mb-4">
        <label class="block text-sm font-medium mb-1 text-cyan-200">Vaisseau</label>
        <select
          [(ngModel)]="selectedShip"
          (change)="onShipChange()"
          [compareWith]="compareShips"
          class="w-full px-3 py-2 rounded-lg bg-[#1b263b]/70 border border-white/20 text-white focus:ring-2 focus:ring-cyan-400 outline-none"
        >
          <option *ngFor="let ship of filteredShipsModal" [ngValue]="ship">{{ ship.name }}</option>
        </select>
      </div>
    </ng-container>

    <ng-template #searchMode>
      <div class="mb-4">
        <label class="block text-sm font-medium mb-1 text-cyan-200">Recherche</label>
        <input
          [(ngModel)]="shipSearchQuery"
          (ngModelChange)="onShipSearchChange()"
          type="text"
          placeholder="Rechercher un vaisseau..."
          class="w-full px-3 py-2 rounded-lg bg-[#1b263b]/70 border border-white/20 text-white focus:ring-2 focus:ring-cyan-400 outline-none"
        />
      </div>

      <div *ngIf="filteredShipsSearch.length > 0" class="mb-4">
        <label class="block text-sm font-medium mb-1 text-cyan-200">Vaisseau</label>
        <select
          [(ngModel)]="selectedShip"
          (change)="onShipChange()"
          [compareWith]="compareShips"
          class="w-full px-3 py-2 rounded-lg bg-[#1b263b]/70 border border-white/20 text-white focus:ring-2 focus:ring-cyan-400 outline-none"
        >
          <option *ngFor="let ship of filteredShipsSearch" [ngValue]="ship">
            {{ ship.name }} — {{ ship.brand.name }}
          </option>
        </select>
      </div>

      <div *ngIf="filteredShipsSearch.length === 0" class="mb-4 text-sm text-gray-400">
        Aucun vaisseau ne correspond a la recherche.
      </div>
    </ng-template>

    <div *ngIf="showAcquisition" class="mb-4">
      <label class="block text-sm font-medium mb-2 text-cyan-200">Methode d'acquisition</label>
      <div class="flex flex-wrap gap-2">
        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'rsi'
          }"
        >
          <input type="radio" name="acquisition" value="rsi" [(ngModel)]="acquisitionType" class="sr-only" />
          Achat RSI
        </label>

        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'ingame'
          }"
        >
          <input type="radio" name="acquisition" value="ingame" [(ngModel)]="acquisitionType" class="sr-only" />
          Achat in-game
        </label>

        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'reward_ingame'
          }"
        >
          <input type="radio" name="acquisition" value="reward_ingame" [(ngModel)]="acquisitionType" class="sr-only" />
          Récompense in-game
        </label>

        <label
          class="cursor-pointer px-4 py-2 rounded-xl border border-white/20 bg-[#1b263b]/60 hover:bg-[#1b263b]/80 transition duration-200 shadow-sm text-sm font-medium"
          [ngClass]="{
            'ring-2 ring-cyan-400 bg-cyan-500/10 border-cyan-400': acquisitionType === 'loaner'
          }"
        >
          <input type="radio" name="acquisition" value="loaner" [(ngModel)]="acquisitionType" class="sr-only" />
          Loaner
        </label>
      </div>
    </div>

    <div class="flex justify-end mt-6">
      <button
        (click)="confirm()"
        class="px-5 py-2 rounded-lg font-semibold bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-400 hover:to-emerald-500
               shadow-lg transition disabled:opacity-50"
        [disabled]="!selectedShip"
      >
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>

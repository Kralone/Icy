<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Visuel catalogue indisponible</title>
  <desc id="desc">Visuel de remplacement IceForge pour une entree sans image externe.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081321"/>
      <stop offset="1" stop-color="#102a3d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>

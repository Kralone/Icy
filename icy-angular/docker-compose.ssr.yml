services:
  frontend_ssr:
    build:
      context: .
      dockerfile: Dockerfile.ssr
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - internal
      - external

  frontend_proxy:
    image: iceforge/frontend-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    depends_on:
      frontend_ssr:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/conf.d/default.ssr.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - icy_images_data:/usr/share/nginx/html/images:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks:
      - internal
      - external

volumes:
  icy_images_data:
    external: true
    name: icy_images_data

networks:
  internal:
    name: iceforge_internal
    external: true
  external:
    name: iceforge_external
    external: true

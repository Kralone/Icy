services:
  frontend_ssr:
    build:
      context: .
      dockerfile: Dockerfile.ssr
    container_name: iceforge_frontend_ssr
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
    expose:
      - "4000"
    networks:
      - internal
      - external

  frontend_proxy:
    image: nginx:stable-alpine
    container_name: iceforge_frontend_proxy
    restart: always
    depends_on:
      - frontend_ssr
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.ssr.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - icy_images_data:/usr/share/nginx/html/images:ro
    networks:
      - internal
      - external

volumes:
  icy_images_data:
    external: true
    name: icy_images_data

networks:
  internal:
    name: iceforge_internal
    external: true
  external:
    name: iceforge_external
    external: true

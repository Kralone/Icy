map $uri $iceforge_known_spa_route {
    default 0;
    "/" 1;
    "/login" 1;
    "/recrutement" 1;
    ~^/guides/(?:minage-star-citizen|salvage|minage/confirmed|hathor)$ 1;
    ~^/utilitaires(?:/(?:collection|executive-hangar|executive-hangar-players|executive-hangar-maps|wikelo|achat-vaisseaux|ressources-minage|fiches-minage|guides))?$ 1;
    ~^/icy(?:/(?:dashboard|profile|scwe|hangar|fleet|events|goals|collection|admin(?:/(?:members|collections|events|sc-world-events|ships|items|data|planets|stations|recrutement|news|icelinkBuilder|images|uex-cache|cig-watch|ore-locations|goals|orbit-spinner-maker))?))?$ 1;
}

server {
    listen 8080;
    server_name iceforge.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 8443 ssl;
    server_name iceforge.fr;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream backend:8080;

    ssl_certificate /etc/letsencrypt/live/iceforge.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iceforge.fr/privkey.pem;

    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 =404 /index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /images/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        autoindex off;
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
    }

    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /guides/minage { return 308 /guides/minage-star-citizen$is_args$args; }
    location = /guides/minage/ressources { return 308 /utilitaires/ressources-minage$is_args$args; }
    location = /guides { return 308 /guides/minage-star-citizen$is_args$args; }
    location = /guide { return 308 /guides/minage-star-citizen$is_args$args; }
    location = /guide/minage { return 308 /guides/minage-star-citizen$is_args$args; }
    location = /guide-minage-star-citizen { return 308 /guides/minage-star-citizen$is_args$args; }
    location = /guide/salvage { return 308 /guides/salvage$is_args$args; }
    location = /guide/hathor { return 308 /guides/hathor$is_args$args; }
    location = /guide/avance { return 308 /guides/minage/confirmed$is_args$args; }
    location = /guide/ressources { return 308 /utilitaires/ressources-minage$is_args$args; }

    location = /login { try_files $uri/index.html $uri @private_spa; }
    location = /utilitaires/collection { try_files $uri/index.html $uri @private_spa; }
    location = /utilitaires/executive-hangar-players { try_files $uri/index.html $uri @private_spa; }
    location = /utilitaires/fiches-minage { try_files $uri/index.html $uri @private_spa; }
    location = /icy { try_files $uri/index.html $uri @private_spa; }
    location ^~ /icy/ { try_files $uri/index.html $uri @private_spa; }

    location @private_spa {
        if ($iceforge_known_spa_route = 0) { return 404; }
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf|eot|svg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri/index.html $uri @public_spa;
    }

    location @public_spa {
        if ($iceforge_known_spa_route = 0) { return 404; }
        try_files /index.html =404;
    }
}


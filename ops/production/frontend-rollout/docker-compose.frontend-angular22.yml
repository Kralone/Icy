services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must reference the immutable Angular 22 image tag}
    build: !reset null
    # The host Let's Encrypt private key is root:root 0600. The nginx master
    # starts as root only to read it, then nginx.prod.conf runs workers as nginx.
    user: "0:0"
    ports: !override
      - "80:8080"
      - "443:8443"
    volumes: !override
      - ${FRONTEND_ROLLOUT_DIR:-/root/iceforge/ops/frontend-rollout}/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ${FRONTEND_ROLLOUT_DIR:-/root/iceforge/ops/frontend-rollout}/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - icy_images_data:/usr/share/nginx/html/images:ro
    healthcheck:
      # Port 8080 redirects to HTTPS. Probe the actual internal TLS listener so
      # wget does not follow the redirect to the nonexistent internal port 443.
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1:8443/index.html >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs: !override
      - /tmp:size=64m,mode=1777
    cap_drop: !override ["ALL"]
    cap_add: !override ["CHOWN", "SETGID", "SETUID"]
    security_opt: !override ["no-new-privileges:true"]
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    networks: !override [internal, external]

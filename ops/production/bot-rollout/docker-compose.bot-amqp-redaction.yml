services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE must reference the immutable redacted bot image tag}
    build: !reset null
    user: "10001:10001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import socket; connection = socket.create_connection(('rabbitmq', 5672), 3); connection.close()
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    read_only: true
    tmpfs: !override
      - /tmp:size=64m,mode=1777
    cap_drop: !override ["ALL"]
    cap_add: !reset []
    security_opt: !override ["no-new-privileges:true"]
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    networks: !override [internal, external]

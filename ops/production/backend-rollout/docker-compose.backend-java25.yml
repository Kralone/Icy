services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must reference the immutable Java 25 image tag}
    build: !reset null
    user: "10001:101"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/front/members"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs: !override
      - /tmp:size=128m,mode=1777
    cap_drop: !override ["ALL"]
    cap_add: !reset []
    security_opt: !override ["no-new-privileges:true"]
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 200
    networks: !override [internal, external]

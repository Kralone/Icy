services:
  db:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${STAGING_POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${STAGING_POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    hostname: iceforge-staging-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${STAGING_RABBITMQ_USER:?required}
      RABBITMQ_DEFAULT_PASS: ${STAGING_RABBITMQ_PASSWORD:?required}
      RABBITMQ_DEFAULT_VHOST: ${STAGING_RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  libretranslate:
    image: libretranslate/libretranslate:v1.9.6@sha256:1de2d7056bb8ad607a412f4563d9abe324ff632b43b5be9428bcc8e213aebb32
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,fr
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: "2"
      OMP_NUM_THREADS: "2"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    expose: ["5000"]
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    mem_limit: 2g
    cpus: "2.0"
    pids_limit: 200
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    networks: [internal, egress]

  init-storage:
    image: ${STAGING_BACKEND_IMAGE:?required}
    user: "0:0"
    entrypoint: ["sh", "-ceu"]
    command:
      - |
        chown 10001:10001 /storage/backend-logs /storage/images /storage/bot-config
        chmod 0750 /storage/backend-logs /storage/images /storage/bot-config
    volumes:
      - backend_logs:/storage/backend-logs
      - images_data:/storage/images
      - bot_config:/storage/bot-config
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "FOWNER"]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"

  backend:
    image: ${STAGING_BACKEND_IMAGE:?required}
    restart: unless-stopped
    user: "10001:101"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${STAGING_POSTGRES_DB:?required}
      SPRING_DATASOURCE_USERNAME: ${STAGING_POSTGRES_USER:?required}
      SPRING_DATASOURCE_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?required}
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      JWT_SECRET: ${STAGING_JWT_SECRET:?required}
      BOT_API_KEY: ${STAGING_BOT_API_KEY:?required}
      IMAGE_BASE_URL: http://127.0.0.1:${STAGING_HTTP_PORT:-19088}/images/
      ICY_CORS_ALLOWED_ORIGINS: http://127.0.0.1:${STAGING_HTTP_PORT:-19088},http://localhost:${STAGING_HTTP_PORT:-19088}
      ICY_RATE_LIMIT_TRUSTED_PROXIES: ${STAGING_FRONTEND_IP:-10.254.40.10}/32
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${STAGING_RABBITMQ_USER:?required}
      RABBITMQ_PASSWORD: ${STAGING_RABBITMQ_PASSWORD:?required}
      RABBITMQ_VHOST: ${STAGING_RABBITMQ_VHOST:-/}
      VAULT_ENABLED: "false"
      CIG_WATCH_PUBLISHING_ENABLED: ${STAGING_CIG_WATCH_PUBLISHING_ENABLED:-false}
      CIG_WATCH_DISCORD_ENABLED: ${STAGING_CIG_WATCH_DISCORD_ENABLED:-false}
      CIG_WATCH_TRANSLATION_URL: ${STAGING_CIG_WATCH_TRANSLATION_URL:-http://libretranslate:5000}
      OPENAI_API_KEY: ${STAGING_OPENAI_API_KEY:-}
      UEX_API_KEY: ${STAGING_UEX_API_KEY:-}
      VAPID_PUBLIC_KEY: ${STAGING_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${STAGING_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${STAGING_VAPID_SUBJECT:-mailto:admin@iceforge.fr}
    depends_on:
      db: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      init-storage: {condition: service_completed_successfully}
      libretranslate: {condition: service_healthy}
    expose: ["8080"]
    volumes:
      - backend_logs:/app/logs
      - images_data:/app/uploads/images
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 2g
    cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/api/front/members"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks: [internal, egress]

  frontend:
    image: ${STAGING_FRONTEND_IMAGE:?required}
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports:
      - "127.0.0.1:${STAGING_HTTP_PORT:-19088}:8080"
    volumes:
      - images_data:/usr/share/nginx/html/images:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 256m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/index.html >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      internal:
        ipv4_address: ${STAGING_FRONTEND_IP:-10.254.40.10}
      egress: {}

  bot:
    image: ${STAGING_BOT_IMAGE:?required}
    profiles: ["discord"]
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${STAGING_DISCORD_TOKEN:-}
      GUILD_ID: ${STAGING_GUILD_ID:-}
      DISCORD_EVENTS_CHANNEL_ID: ${STAGING_DISCORD_EVENTS_CHANNEL_ID:-}
      DISCORD_NEWS_CHANNEL_ID: ${STAGING_DISCORD_NEWS_CHANNEL_ID:-}
      DISCORD_NOTIFICATIONS_CHANNEL_ID: ${STAGING_DISCORD_NOTIFICATIONS_CHANNEL_ID:-}
      DISCORD_DISCUSSION_CHANNEL_ID: ${STAGING_DISCORD_DISCUSSION_CHANNEL_ID:-}
      ENV_MODE: staging
      BACKEND_API_URL: http://backend:8080
      BOT_API_KEY: ${STAGING_BOT_API_KEY:?required}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${STAGING_RABBITMQ_USER:?required}
      RABBITMQ_PSWD: ${STAGING_RABBITMQ_PASSWORD:?required}
      VAULT_ENABLED: "false"
    depends_on:
      backend: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    volumes:
      - bot_config:/app/config
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    mem_limit: 512m
    cpus: "1.0"
    networks: [internal, egress]

volumes:
  libretranslate_models:
    name: iceforge_staging_libretranslate_models
  postgres_data:
    name: iceforge_staging_postgres18
  rabbitmq_data:
    name: iceforge_staging_rabbitmq
  backend_logs:
    name: iceforge_staging_backend_logs
  images_data:
    name: iceforge_staging_images
  bot_config:
    name: iceforge_staging_bot_config

networks:
  internal:
    name: iceforge_staging_internal
    internal: true
    ipam:
      config:
        - subnet: ${STAGING_INTERNAL_SUBNET:-10.254.40.0/24}
  egress:
    name: iceforge_staging_egress
    driver: bridge

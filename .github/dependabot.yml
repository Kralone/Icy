version: 2

updates:
  - package-ecosystem: maven
    directory: /icy_backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /icy-angular
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /icy
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /
      - /icy
      - /icy-angular
      - /icy_backend
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(docker)"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

version: 2

updates:
  - package-ecosystem: maven
    directory: /icy_backend
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /icy-angular
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Angular 22 exige typescript >=6.0 <6.1.
      - dependency-name: typescript
        versions: [">= 7, < 8"]
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /icy
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(deps)"
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directories:
      - /
      - /icy
      - /icy-angular
      - /icy_backend
    schedule:
      interval: weekly
      day: monday
      time: "04:45"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Java 26 n'est pas LTS ; l'enforcer du backend exige [25,26).
      - dependency-name: eclipse-temurin
        versions: [">= 26, < 27"]
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    rebase-strategy: auto
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

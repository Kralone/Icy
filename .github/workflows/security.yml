name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          license-check: false

  repository-scan:
    name: Repository vulnerabilities, secrets and IaC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository
        env:
          # Avoid flaky Maven Central lookups; the vulnerability databases are
          # still refreshed by Trivy and lockfiles are scanned locally.
          TRIVY_OFFLINE_SCAN: "true"
          # Build tooling is part of the software supply chain.
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  image-scan:
    name: Runtime image vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Date of the OS package refresh
        id: day
        run: echo "value=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      # Même cache de couches que la CI ; les paquets système sont rafraîchis chaque jour,
      # le scan voit donc ce qui serait livré aujourd'hui.
      - name: Build application images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE: gha
          SKIP_TESTS: "true"
          OS_PACKAGES_REFRESH: ${{ steps.day.outputs.value }}
        with:
          source: .
          files: docker-bake.hcl
          targets: all
          load: true
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/backend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan bot runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/bot:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/frontend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan frontend SSR runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/frontend-ssr:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan frontend proxy runtime image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/frontend-proxy:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Report PostgreSQL OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
      - name: Block fixable PostgreSQL OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true
      - name: Report RabbitMQ OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: rabbitmq:4.3.7-management@sha256:8e913a7748f808be4ce117c3df11817935775bcd83934d4de92441a7e93e9899
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table
          skip-setup-trivy: true
      - name: Block fixable RabbitMQ OS vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: rabbitmq:4.3.7-management@sha256:8e913a7748f808be4ce117c3df11817935775bcd83934d4de92441a7e93e9899
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
          skip-setup-trivy: true

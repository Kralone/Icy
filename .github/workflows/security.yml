name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false

  repository-scan:
    name: Repository vulnerabilities, secrets and IaC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository
        env:
          # Avoid flaky Maven Central lookups; the vulnerability databases are
          # still refreshed by Trivy and lockfiles are scanned locally.
          TRIVY_OFFLINE_SCAN: "true"
          # Build tooling is part of the software supply chain.
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

  image-scan:
    name: Runtime image vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build application images
        run: |
          docker compose build backend bot frontend
          docker build --file icy-angular/Dockerfile.ssr --tag iceforge/frontend-ssr:ci icy-angular
          docker build --file icy-angular/Dockerfile.proxy --tag iceforge/frontend-proxy:ci icy-angular
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/backend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan bot runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/bot:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan frontend runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/frontend:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan frontend SSR runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/frontend-ssr:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan frontend proxy runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: iceforge/frontend-proxy:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: postgres:18.6-bookworm@sha256:7d2695c3aa88e792e8b3b233e7e4adb296a20412c6c0ca361e3edaaacfada108
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: Scan RabbitMQ image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.74.0
          image-ref: rabbitmq:4.3.5-management@sha256:06fb591136a49e861e01aaaf9ce45085839ca23c35913d45a1e83519bb9778ca
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

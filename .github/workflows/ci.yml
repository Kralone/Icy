name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      staging:
        description: "Staging : auto (redéployer s'il tourne), start (le démarrer), none"
        type: choice
        options: [auto, start, none]
        default: auto

permissions:
  contents: read

# Une PR annule son run précédent ; sur main, chaque merge va au bout (images et staging).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Préfixe GHCR des images livrées (pas IMAGE_PREFIX : bake lirait la variable dans tous les jobs) (nom de dépôt en minuscules, exigé par le registre).
  GHCR_PREFIX: ghcr.io/kralone/iceforge-

jobs:
  changes:
    name: Parties modifiées
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Un lancement manuel vérifie tout.
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      bot: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.bot == 'true' }}
      compose: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.compose == 'true' }}
      stack: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.stack == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Detect changed paths
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            backend:
              - *ci
              - .java-version
              - icy_backend/**
            frontend:
              - *ci
              - icy-angular/**
            bot:
              - *ci
              - .python-version
              - icy/**
            compose:
              - *ci
              - docker-compose*.yml
              - icy-angular/docker-compose.ssr.yml
            stack:
              - *ci
              - .java-version
              - .python-version
              - docker-bake.hcl
              - docker-compose.yml
              - docker-compose.validation.yml
              - icy_backend/**
              - icy-angular/**
              - icy/**
              - ops/staging/**
              - ops/testing/validation-fixtures.sql

  backend:
    name: Backend — Java 25 / Maven
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Temurin 25
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: icy_backend/pom.xml
      - name: Verify backend
        working-directory: icy_backend
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend — Node 24 / Angular
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: icy-angular/.nvmrc
          cache: npm
          cache-dependency-path: icy-angular/package-lock.json
      - name: Install locked dependencies
        working-directory: icy-angular
        run: npm ci
      - name: Build production frontend
        working-directory: icy-angular
        run: npm run build:production
      - name: Run frontend tests
        working-directory: icy-angular
        run: npm run test:ci

  bot:
    name: Bot — Python 3.14
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: icy/requirements.lock
      - name: Install locked dependencies
        working-directory: icy
        run: python -m pip install --requirement requirements.lock
      - name: Validate Python environment
        working-directory: icy
        run: |
          python -m pip check
          python -m compileall -q .
      - name: Run bot tests
        working-directory: icy
        run: python -m unittest discover -s tests -v

  compose:
    name: Docker Compose configuration
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_USER: iceforge_ci
      POSTGRES_PASSWORD: iceforge_ci_password
      POSTGRES_DB: iceforgedb
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iceforgedb
      SPRING_DATASOURCE_USERNAME: iceforge_ci
      SPRING_DATASOURCE_PASSWORD: iceforge_ci_password
      JWT_SECRET: iceforge_ci_jwt_secret_32_chars_minimum_123456
      BOT_API_KEY: iceforge_ci_bot_api_key
      RABBITMQ_USER: icy_ci
      RABBITMQ_PSWD: iceforge_ci_rabbit_password
      DISCORD_TOKEN: iceforge_ci_discord_token
      GUILD_ID: "123456789"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate base and test configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.validation.yml config --quiet
          docker compose -f icy-angular/docker-compose.ssr.yml config --quiet
      - name: Validate production configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  # Démarre en même temps que les tests : les images viennent du cache de couches GitHub
  # Actions, et la construction Docker ne relance pas les tests Java (job backend).
  integration:
    name: Isolated Compose smoke test
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_USER: iceforge_ci
      POSTGRES_PASSWORD: iceforge_ci_password
      POSTGRES_DB: iceforgedb
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iceforgedb
      SPRING_DATASOURCE_USERNAME: iceforge_ci
      SPRING_DATASOURCE_PASSWORD: iceforge_ci_password
      JWT_SECRET: iceforge_ci_jwt_secret_32_chars_minimum_123456
      BOT_API_KEY: iceforge_ci_bot_api_key
      RABBITMQ_USER: icy_ci
      RABBITMQ_PSWD: iceforge_ci_rabbit_password
      RABBITMQ_VHOST: /
      VAULT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Date of the OS package refresh
        id: day
        run: echo "value=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - name: Build application images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE: gha
          SKIP_TESTS: "true"
          BUILD_COMMIT: ${{ github.sha }}
          OS_PACKAGES_REFRESH: ${{ steps.day.outputs.value }}
        with:
          source: .
          files: docker-bake.hcl
          targets: default
          load: true
      - name: Start isolated stack
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          up -d --no-build --wait --wait-timeout 300
          db rabbitmq backend frontend
      - name: Verify API through Nginx
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          exec -T frontend wget -qO-
          http://127.0.0.1:8080/api/front/members
      - name: Verify frontend runs without root
        run: >-
          test "$(docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          exec -T frontend id -u)" = "101"
      - name: Verify RabbitMQ application queues
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          exec -T rabbitmq rabbitmqctl list_queues name durable consumers messages
      - name: Show service diagnostics on failure
        if: failure()
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          logs --no-color --tail 200
      - name: Clean isolated stack
        if: always()
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          down -v --remove-orphans

  # Sur main uniquement : les trois images de la révision, poussées sur GHCR et repérées par digest.
  # Mêmes réglages que le test d'intégration : la construction repart de son cache.
  publish:
    name: Publish images (GHCR)
    needs: [changes, backend, frontend, bot, compose, integration]
    if: >-
      always()
      && github.ref == 'refs/heads/main'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.changes.outputs.stack == 'true'
      && needs.integration.result == 'success'
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.digests.outputs.backend }}
      bot: ${{ steps.digests.outputs.bot }}
      frontend: ${{ steps.digests.outputs.frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Date of the OS package refresh
        id: day
        run: echo "value=$(date -u +%F)" >>"$GITHUB_OUTPUT"
      - name: Build and push application images
        id: bake
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          CACHE: gha
          SKIP_TESTS: "true"
          BUILD_COMMIT: ${{ github.sha }}
          OS_PACKAGES_REFRESH: ${{ steps.day.outputs.value }}
          IMAGE_PREFIX: ${{ env.GHCR_PREFIX }}
          TAG: ${{ github.sha }}
        with:
          source: .
          files: docker-bake.hcl
          targets: default
          push: true
      - name: Read image digests
        id: digests
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          for component in backend bot frontend; do
            digest=$(jq -er --arg c "$component" '.[$c]["containerimage.digest"]' <<<"$METADATA")
            [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Digest $component illisible" >&2; exit 1; }
            echo "$component=$digest" >>"$GITHUB_OUTPUT"
            echo "- \`${GHCR_PREFIX}${component}@${digest}\`" >>"$GITHUB_STEP_SUMMARY"
          done
      - name: Assemble staging release files
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          BOT_DIGEST: ${{ steps.digests.outputs.bot }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/release
          mkdir -p "$out"
          cp ops/staging/{docker-compose.staging.yml,prepare-env.sh,configure-discord.sh,install-release.sh,deploy.sh,verify.sh,verify-discord-e2e.sh,destroy.sh,suspend.sh,resume.sh,README.md} "$out/"
          cp ops/testing/validation-fixtures.sql "$out/"
          jq -n \
            --arg revision "$GITHUB_SHA" \
            --arg prefix "$GHCR_PREFIX" \
            --arg backend "$BACKEND_DIGEST" --arg bot "$BOT_DIGEST" --arg frontend "$FRONTEND_DIGEST" \
            --arg created "$(date -u +%FT%TZ)" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{revision: $revision, images: {
                backend: ($prefix + "backend@" + $backend),
                bot: ($prefix + "bot@" + $bot),
                frontend: ($prefix + "frontend@" + $frontend)},
              createdAtUtc: $created, ciRun: $run}' >"$out/release.json"
          mapfile -t files < <(cd "$out" && ls)
          tar --create --file "$RUNNER_TEMP/release.tar" --owner=0 --group=0 --mode=u+rw,go+r \
            -C "$out" "${files[@]}"
          tar --list --verbose --file "$RUNNER_TEMP/release.tar"
      - name: Upload staging release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-release-${{ github.sha }}
          path: ${{ runner.temp }}/release.tar
          retention-days: 30

  # Désactivé tant que la variable de dépôt STAGING_DEPLOY n'est pas « enabled » :
  # la mise en place côté VPS est décrite dans ops/staging/CI-DEPLOY.md.
  deploy-staging:
    name: Deploy staging
    needs: publish
    if: >-
      always()
      && needs.publish.result == 'success'
      && vars.STAGING_DEPLOY == 'enabled'
      && (github.event_name == 'push' || inputs.staging != 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: staging
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Download staging release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staging-release-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" >~/.ssh/staging_ed25519
          chmod 0600 ~/.ssh/staging_ed25519
          printf '%s\n' "$KNOWN_HOSTS" >~/.ssh/known_hosts
      - name: Install and deploy on the VPS
        env:
          HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_USER: ${{ vars.STAGING_SSH_USER || 'iceforge-ci' }}
          MODE: ${{ inputs.staging || 'auto' }}
          BACKEND_DIGEST: ${{ needs.publish.outputs.backend }}
          BOT_DIGEST: ${{ needs.publish.outputs.bot }}
          FRONTEND_DIGEST: ${{ needs.publish.outputs.frontend }}
        run: >-
          ssh -T -i ~/.ssh/staging_ed25519
          -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30
          "$SSH_USER@$HOST"
          "$MODE $GITHUB_SHA $BACKEND_DIGEST $BOT_DIGEST $FRONTEND_DIGEST"
          <"$RUNNER_TEMP/release.tar"
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/staging_ed25519

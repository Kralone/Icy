name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — Java 25 / Maven
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Temurin 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version-file: .java-version
          cache: maven
          cache-dependency-path: icy_backend/pom.xml
      - name: Verify backend
        working-directory: icy_backend
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend — Node 24 / Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: icy-angular/package-lock.json
      - name: Install locked dependencies
        working-directory: icy-angular
        run: npm ci
      - name: Build production frontend
        working-directory: icy-angular
        run: npm run build:production
      - name: Run frontend tests
        working-directory: icy-angular
        run: npm run test:ci

  bot:
    name: Bot — Python 3.14
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: icy/requirements.lock
      - name: Install locked dependencies
        working-directory: icy
        run: python -m pip install --requirement requirements.lock
      - name: Validate Python environment
        working-directory: icy
        run: |
          python -m pip check
          python -m compileall -q .
      - name: Run bot tests
        working-directory: icy
        run: python -m unittest discover -s tests -v

  compose:
    name: Docker Compose configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_USER: iceforge_ci
      POSTGRES_PASSWORD: iceforge_ci_password
      POSTGRES_DB: iceforgedb
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iceforgedb
      SPRING_DATASOURCE_USERNAME: iceforge_ci
      SPRING_DATASOURCE_PASSWORD: iceforge_ci_password
      JWT_SECRET: iceforge_ci_jwt_secret_32_chars_minimum_123456
      BOT_API_KEY: iceforge_ci_bot_api_key
      RABBITMQ_USER: icy_ci
      RABBITMQ_PSWD: iceforge_ci_rabbit_password
      DISCORD_TOKEN: iceforge_ci_discord_token
      GUILD_ID: "123456789"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate base and test configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.validation.yml config --quiet
      - name: Validate production configuration
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

  integration:
    name: Isolated Compose smoke test
    needs: [backend, frontend, bot, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      POSTGRES_USER: iceforge_ci
      POSTGRES_PASSWORD: iceforge_ci_password
      POSTGRES_DB: iceforgedb
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/iceforgedb
      SPRING_DATASOURCE_USERNAME: iceforge_ci
      SPRING_DATASOURCE_PASSWORD: iceforge_ci_password
      JWT_SECRET: iceforge_ci_jwt_secret_32_chars_minimum_123456
      BOT_API_KEY: iceforge_ci_bot_api_key
      RABBITMQ_USER: icy_ci
      RABBITMQ_PSWD: iceforge_ci_rabbit_password
      RABBITMQ_VHOST: /
      VAULT_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start isolated stack
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          up -d --build --wait --wait-timeout 300
          db rabbitmq backend frontend icy-images
      - name: Verify API through Nginx
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          exec -T frontend wget -qO-
          http://127.0.0.1/api/front/members
      - name: Verify RabbitMQ application queues
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          exec -T rabbitmq rabbitmqctl list_queues name durable consumers messages
      - name: Show service diagnostics on failure
        if: failure()
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          logs --no-color --tail 200
      - name: Clean isolated stack
        if: always()
        run: >-
          docker compose -p iceforge-ci
          -f docker-compose.yml
          -f docker-compose.validation.yml
          down -v --remove-orphans

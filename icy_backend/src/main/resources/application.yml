spring:
    application:
        name: iceforge-backend

    messages:
        encoding: UTF-8

    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:icy}
      password: ${RABBITMQ_PASSWORD:}
      virtual-host: ${RABBITMQ_VHOST:/}

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iceforgedb}
        username: ${SPRING_DATASOURCE_USERNAME:iceforge}
        password: ${SPRING_DATASOURCE_PASSWORD:}
        driver-class-name: org.postgresql.Driver

    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: validate
        show-sql: true

    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration
        validate-on-migrate: true

    jackson:
      time-zone: Europe/Paris

    servlet:
      multipart:
        max-file-size: 50MB       # limite pour chaque fichier
        max-request-size: 100MB   # limite totale pour la requête

jwt:
    secret: ${JWT_SECRET:CHANGE_ME_WITH_32_CHARS_MINIMUM_VALUE}
    access-expiration: 900000   # 15 minutes (access token)
    refresh-expiration: 604800000  # 7 jours (refresh token)
    rotation-enabled: true  # Activation de la rotation des refresh tokens

icy:
  image:
    path: /app/uploads/images
    base-url: ${IMAGE_BASE_URL:http://localhost:8081/images/}
  wikelo:
    spreadsheet-id: ${WIKELO_SPREADSHEET_ID:1ji0q_pp6iW35RG1YyFEsv-lsmZOaCStJXGdIEdLLwhM}
    ships-gid: ${WIKELO_SHIPS_GID:481073732}
    ships-sheet-name: ${WIKELO_SHIPS_SHEET_NAME:Ships 4.5}
  uex:
    base-url: ${UEX_API_BASE_URL:https://api.uexcorp.uk/2.0}
    api-key: ${UEX_API_KEY:}


security:
    csrf:
        enabled: true  # Protection CSRF activée
    cors:
        allowed-origins: "https://iceforge.fr,http://localhost:3000"  # Seul ton frontend est autorisé
        allowed-methods: "GET,POST,PUT,DELETE"
        allowed-headers: "Authorization,Content-Type,X-XSRF-TOKEN"
        allow-credentials: true  # Autoriser les cookies (refreshToken)

server:
    port: 8080

logging:
    level:
        root: INFO  # Niveau par défaut pour éviter trop de logs inutiles
        com.icy.icy_backend.controller: DEBUG  # Logs détaillés pour les contrôleurs
        com.icy.icy_backend.service: DEBUG  # Logs détaillés pour les services
        org.springframework: WARN  # Réduire le bruit des logs Spring
        org.hibernate.SQL: INFO  # Afficher les requêtes SQL exécutées
        org.springframework.security: INFO
        org.springframework.web.cors: INFO



management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics

vault:
  enabled: ${VAULT_ENABLED:false}
  address: ${VAULT_ADDR:http://localhost:8200}
  kv:
    mount: ${VAULT_KV_MOUNT:secret}
    path: ${VAULT_KV_PATH:iceforge/dev/backend}
  auth:
    role-id: ${VAULT_ROLE_ID:}
    secret-id: ${VAULT_SECRET_ID:}
  fail-fast: ${VAULT_FAIL_FAST:true}

bot:
    api-key: ${BOT_API_KEY:}
    url: ${BOT_URL:http://bot:8090}

openai:
  api-key: ${OPENAI_API_KEY:}

push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@iceforge.fr}

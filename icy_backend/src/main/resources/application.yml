spring:
    application:
        name: iceforge-backend

    messages:
        encoding: UTF-8

    rabbitmq:
      host: ${RABBITMQ_HOST:localhost}
      port: ${RABBITMQ_PORT:5672}
      username: ${RABBITMQ_USERNAME:icy}
      password: ${RABBITMQ_PASSWORD:}
      virtual-host: ${RABBITMQ_VHOST:/}

    datasource:
        url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iceforgedb}
        username: ${SPRING_DATASOURCE_USERNAME:iceforge}
        password: ${SPRING_DATASOURCE_PASSWORD:}
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: ${HIBERNATE_SHOW_SQL:false}

    flyway:
        enabled: true
        # Kept for enrollment of the one known pre-Flyway V1 production schema.
        # Set FLYWAY_BASELINE_ON_MIGRATE=false once every environment has history.
        baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
        locations: classpath:db/migration
        validate-on-migrate: true

    jackson:
      time-zone: Europe/Paris

    servlet:
      multipart:
        max-file-size: 25MB
        max-request-size: 25MB

jwt:
    secret: ${JWT_SECRET}
    access-expiration: 900000   # 15 minutes (access token)
    refresh-expiration: 604800000  # 7 jours (refresh token)
    rotation-enabled: true  # Activation de la rotation des refresh tokens

icy:
  cors:
    # Comma-separated exact origins. Production stays restrictive by default;
    # local/validation origins must be opted in by their Compose overlay.
    allowed-origins: ${ICY_CORS_ALLOWED_ORIGINS:https://iceforge.fr}
  rate-limit:
    # X-Forwarded-For is ignored unless the direct peer matches this explicit list/CIDR set.
    trusted-proxies: ${ICY_RATE_LIMIT_TRUSTED_PROXIES:}
    maximum-entries: ${ICY_RATE_LIMIT_MAXIMUM_ENTRIES:20000}
    login:
      ip-attempts: ${ICY_RATE_LIMIT_LOGIN_IP_ATTEMPTS:20}
      identity-attempts: ${ICY_RATE_LIMIT_LOGIN_IDENTITY_ATTEMPTS:10}
      window-seconds: ${ICY_RATE_LIMIT_LOGIN_WINDOW_SECONDS:300}
    refresh:
      attempts: ${ICY_RATE_LIMIT_REFRESH_ATTEMPTS:60}
      window-seconds: ${ICY_RATE_LIMIT_REFRESH_WINDOW_SECONDS:300}
    reset-password:
      attempts: ${ICY_RATE_LIMIT_RESET_PASSWORD_ATTEMPTS:10}
      window-seconds: ${ICY_RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}
    recruitment:
      attempts: ${ICY_RATE_LIMIT_RECRUITMENT_ATTEMPTS:5}
      window-seconds: ${ICY_RATE_LIMIT_RECRUITMENT_WINDOW_SECONDS:3600}
  image:
    path: /app/uploads/images
    base-url: ${IMAGE_BASE_URL:http://localhost:8081/images/}
  wikelo:
    spreadsheet-id: ${WIKELO_SPREADSHEET_ID:1ji0q_pp6iW35RG1YyFEsv-lsmZOaCStJXGdIEdLLwhM}
    ships-gid: ${WIKELO_SHIPS_GID:481073732}
    ships-sheet-name: ${WIKELO_SHIPS_SHEET_NAME:Ships 4.5}
  uex:
    base-url: ${UEX_API_BASE_URL:https://api.uexcorp.uk/2.0}
    api-key: ${UEX_API_KEY:}
    refresh-attempts: ${UEX_API_REFRESH_ATTEMPTS:3}
    retry-delay-millis: ${UEX_API_RETRY_DELAY_MILLIS:2000}
  catalog-sync:
    wiki-base-url: ${SC_WIKI_API_BASE_URL:https://api.star-citizen.wiki/api}
    page-size: ${SC_WIKI_API_PAGE_SIZE:200}
    uex-delay-millis: ${UEX_API_DELAY_MILLIS:6500}
    user-agent: ${CATALOG_SYNC_USER_AGENT:IceForge/1.0 (https://iceforge.fr)}


server:
    port: 8080

logging:
    level:
        root: INFO  # Niveau par défaut pour éviter trop de logs inutiles
        com.icy.icy_backend.controller: INFO
        com.icy.icy_backend.service: INFO
        org.springframework: WARN  # Réduire le bruit des logs Spring
        org.hibernate.SQL: WARN
        org.springframework.security: INFO
        org.springframework.web.cors: INFO



management:
    endpoints:
        web:
            exposure:
                include: health, info, metrics

vault:
  enabled: ${VAULT_ENABLED:false}
  address: ${VAULT_ADDR:http://localhost:8200}
  kv:
    mount: ${VAULT_KV_MOUNT:secret}
    path: ${VAULT_KV_PATH:iceforge/dev/backend}
  auth:
    role-id: ${VAULT_ROLE_ID:}
    secret-id: ${VAULT_SECRET_ID:}
  fail-fast: ${VAULT_FAIL_FAST:true}

bot:
    api-key: ${BOT_API_KEY:}

openai:
  api-key: ${OPENAI_API_KEY:}

push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: ${VAPID_SUBJECT:mailto:admin@iceforge.fr}

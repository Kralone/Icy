services:
  vault:
    image: hashicorp/vault:1.17.6@sha256:74a4ab138ab5d64725e89cd9a9c73f7040c7fe49e98b71697b275ca9a69919df
    restart: unless-stopped
    user: "0:0"
    entrypoint: ["vault"]
    cap_add:
      - IPC_LOCK
    ports:
      - "127.0.0.1:8200:8200"
    volumes:
      - ./.secrets/vault/data_raft:/vault/data
      - ./vault/config:/vault/config
    command: ["server", "-config=/vault/config/vault.hcl"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal

networks:
  internal:
    name: iceforge_internal
    internal: true

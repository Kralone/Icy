services:
  db:
    ports: !override ["127.0.0.1:15432:5432"]
    networks: [internal, external]

  rabbitmq:
    ports: !override
      - "127.0.0.1:15672:5672"
      - "127.0.0.1:25672:15672"
    networks: [internal, external]

  backend:
    environment:
      VAULT_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-iceforgedb}
      ICY_CORS_ALLOWED_ORIGINS: http://127.0.0.1:18088,http://localhost:18088,http://localhost:4200
      IMAGE_BASE_URL: http://127.0.0.1:18088/images/
    ports: !override ["127.0.0.1:18080:8080"]
    networks: [internal, external]

  bot:
    # Discord is opt-in so the local web stack can run without a real token.
    profiles: ["dev-discord"]
    environment:
      VAULT_ENABLED: "false"
      ENV_MODE: development

  frontend:
    ports: !override ["127.0.0.1:18088:8080"]

  icy-images:
    ports: !override ["127.0.0.1:18081:80"]
    networks: [internal, external]

volumes:
  postgres18_data:
    name: iceforge_dev_postgres18
  rabbitmq_data:
    name: iceforge_dev_rabbitmq
  backend_logs:
    name: iceforge_dev_backend_logs
  bot_config:
    name: iceforge_dev_bot_config
  icy_images_data:
    name: iceforge_dev_images

networks:
  internal:
    name: iceforge_dev_internal
  external:
    name: iceforge_dev_external

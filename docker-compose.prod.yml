services:
  db:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 200

  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PSWD:?RABBITMQ_PSWD is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    cpus: "1.0"
    mem_limit: 1g
    pids_limit: 300

  backend:
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://iceforge.fr/images/}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      BOT_API_KEY: ${BOT_API_KEY:?BOT_API_KEY is required}
      RABBITMQ_USERNAME: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PSWD:?RABBITMQ_PSWD is required}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      # Production already owns a qualified Flyway history. Never guess a
      # baseline on an unknown/non-empty production schema.
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      # Exact Nginx address: trusting a broad Docker subnet would let another
      # compromised container forge X-Forwarded-For.
      ICY_RATE_LIMIT_TRUSTED_PROXIES: ${ICEFORGE_PROD_FRONTEND_IP:-10.253.40.10}/32
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cpus: "1.5"
    mem_limit: 1536m
    pids_limit: 300

  bot:
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?DISCORD_TOKEN is required}
      GUILD_ID: ${GUILD_ID:?GUILD_ID is required}
      BOT_API_KEY: ${BOT_API_KEY:?BOT_API_KEY is required}
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PSWD: ${RABBITMQ_PSWD:?RABBITMQ_PSWD is required}
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cpus: "0.5"
    mem_limit: 512m
    pids_limit: 150

  frontend:
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./icy-angular/nginx/conf.d/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: "0.5"
    mem_limit: 256m
    pids_limit: 100
    networks:
      internal:
        ipv4_address: ${ICEFORGE_PROD_FRONTEND_IP:-10.253.40.10}
      external: {}

  icy-images:
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    security_opt: ["no-new-privileges:true"]
    cpus: "0.25"
    mem_limit: 128m
    pids_limit: 100

networks:
  internal:
    ipam:
      config:
        - subnet: ${ICEFORGE_PROD_INTERNAL_SUBNET:-10.253.40.0/24}
